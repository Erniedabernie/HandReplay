  /* ---------------------------------------------------- add a loose hand
     No table to seat: pick how many are in, the blinds, and which seat is yours.
     The seats are the positions themselves, so the hand reads "CO 70 · BTN
     3-bet 220" with nobody named. Names can go on afterwards, and the whole hand
     can be moved into a session later. */
  function quickHandSheet() {
    var q = quick();
    var body = h('div', {});

    var players = h('select', { class: 'select', 'aria-label': 'Players' });
    for (var i = 2; i <= SEATS_MAX; i++) {
      players.appendChild(h('option', { value: String(i), text: i + ' handed' }));
    }
    players.value = String(q.players);
    var sb = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric',
      value: q.sb, 'aria-label': 'Small blind'
    });
    var bb = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric',
      value: q.bb, 'aria-label': 'Big blind'
    });
    var date = h('input', { class: 'input', type: 'date', value: todayISO(), 'aria-label': 'Date' });

    /* The cast, not just his own seat: everyone else folds the moment it is their
       turn, so he is never asked about a seat that was never in the hand. */
    var chips = h('div', { class: 'poschips', role: 'group', 'aria-label': 'Positions in the hand' });
    var whoHint = h('p', { class: 'phint' });
    var whoSel = h('select', { class: 'select', 'aria-label': 'Which position is you' });
    var involved = [];
    var heroPos = null;

    function drawChips() {
      var names = HR.positionsFor(Number(players.value));
      involved = involved.filter(function (p) { return names.indexOf(p) >= 0; });
      chips.innerHTML = '';
      names.forEach(function (p) {
        var on = involved.indexOf(p) >= 0;
        chips.appendChild(h('button', {
          class: 'chipbtn' + (on ? ' on' : ''), text: p,
          'aria-pressed': on ? 'true' : 'false',
          'aria-label': p + (on ? ' — in the hand' : ' — not in the hand'),
          on: {
            click: function () {
              if (on) involved = involved.filter(function (x) { return x !== p; });
              else involved = names.filter(function (x) {
                return x === p || involved.indexOf(x) >= 0;      /* keep table order */
              });
              drawChips(); drawWho(); ready();
            }
          }
        }));
      });
      whoHint.textContent = involved.length < 2
        ? 'Pick every position that was in the hand — two or more.'
        : involved.join(' · ') + ' were in it. Everyone else folds on their turn.';
    }
    function drawWho() {
      var keep = whoSel.value;
      whoSel.innerHTML = '';
      involved.forEach(function (p) {
        whoSel.appendChild(h('option', { value: p, text: p }));
      });
      whoSel.appendChild(h('option', { value: '', text: 'Not in the hand' }));
      /* his last position if it is in the cast, else whatever he had chosen, else
         the first seat in — one fewer tap on the common case */
      if (involved.indexOf(keep) >= 0) whoSel.value = keep;
      else if (involved.indexOf(q.heroPos) >= 0) whoSel.value = q.heroPos;
      else whoSel.value = involved.length ? involved[0] : '';
      heroPos = whoSel.value || null;
    }
    whoSel.addEventListener('change', function () { heroPos = whoSel.value || null; });
    players.addEventListener('change', function () { drawChips(); drawWho(); ready(); });
    drawChips();
    drawWho();

    body.appendChild(h('div', { class: 'fieldrow' }, [
      h('div', { class: 'field' }, [h('label', { text: 'Players' }), players]),
      h('div', { class: 'field' }, [h('label', { text: 'Date' }), date])
    ]));
    body.appendChild(h('div', { class: 'fieldrow', style: 'margin-top:12px' }, [
      h('div', { class: 'field' }, [h('label', { text: 'Small blind' }), sb]),
      h('div', { class: 'field' }, [h('label', { text: 'Big blind' }), bb])
    ]));
    body.appendChild(h('div', { class: 'field', style: 'margin-top:14px' }, [
      h('label', { text: 'Who was in the hand' }), chips
    ]));
    body.appendChild(whoHint);
    body.appendChild(h('div', { class: 'prow' }, [
      h('span', { class: 'plabel', text: 'You are' }), whoSel
    ]));

    function ready() {
      var okBtn = document.querySelector('[data-quick]');
      if (okBtn) okBtn.disabled = involved.length < 2;
    }
    openSheet('Add hand', 'No session needed — positions are enough.', body, [
      h('button', {
        class: 'btn btn-primary', text: 'Add hand', data: { quick: '1' },
        on: {
          click: function () {
            var n = Number(players.value);
            var big = Number(bb.value) > 0 ? Number(bb.value) : 10;
            var small = Number(sb.value) > 0 ? Number(sb.value) : big / 2;
            if (involved.length < 2) return;
            db.settings.quick = { players: n, sb: small, bb: big, heroPos: heroPos };
            closeSheet();
            addLooseHand({
              players: n, sb: small, bb: big, currency: db.settings.currency || 'HK$',
              date: isoToDMY(date.value), heroPos: heroPos, involved: involved.slice()
            });
          }
        }
      })
    ]);
    ready();
  }

  function addLooseHand(v) {
    var box = looseBox(true);
    var names = HR.positionsFor(v.players);
    var heroIdx = v.heroPos ? names.indexOf(v.heroPos) : -1;
    var m = me() || playerFor('EDB', true);
    /* seat i IS position i, so the cast converts straight to seat indices */
    var involved = (v.involved || []).map(function (p) { return names.indexOf(p); })
      .filter(function (i) { return i >= 0; });
    /* Seats 0..n-1 with the button on the last one: seatOrder then returns them
       in order, so seat i IS position i. No arithmetic to get wrong. */
    var hd = {
      id: uid('h'), no: nextHandNo(box), ts: Date.now(), heroCardsNA: false,
      date: v.date, venue: '', currency: v.currency,
      sb: v.sb, bb: v.bb,
      ante: db.settings.anteOn ? (Number(db.settings.ante) || 0) : 0,
      straddle: null, effStack: null,
      buttonSeat: v.players - 1,
      players: v.players,
      loose: true,
      involved: involved,
      seats: names.map(function (nm, i) {
        return {
          seat: i,
          playerId: i === heroIdx ? m.id : null,
          name: i === heroIdx ? m.name : '',      /* '' means "the position is the name" */
          stack: null,
          hero: i === heroIdx
        };
      }),
      boards: [[], [], [], []],
      hole: {}, actions: [], winners: [],
      note: '', imageKey: null, complete: false
    };
    box.hands.unshift(hd);
    /* fold the seats that were never in it, so the hand opens on the first player
       who actually was */
    autoFoldOutsiders(hd);
    save();
    go('hand', { sessionId: box.id, handId: hd.id });
    /* nobody's hand to ask about if he was not in it */
    if (heroIdx >= 0) setTimeout(function () { askHole(hd); }, 60);
  }

  /* Put names on a hand recorded by position. Blank stays blank — the position
     keeps standing in for it. Names go through the roster, so an opponent named
     here is the same entity as one seated in a session. */
  /* Who is worth naming: the cast. Seats that folded automatically because they
     were never in the hand are noise on this sheet. Older loose hands have no
     cast recorded, so they fall back to the whole table. */
  function nameableSeats(hd, snap) {
    var cast = (hd.involved || []).slice().sort(function (a, b) { return a - b; });
    if (!cast.length) return snap.order.slice().sort(function (a, b) { return a - b; });
    return cast.filter(function (i) { return snap.seatMap[i]; });
  }

  function namePlayersSheet(hd, opts) {
    opts = opts || {};
    var snap = HR.replay(hd);
    var body = h('div', {});
    var inputs = {};
    nameableSeats(hd, snap).forEach(function (seatIdx) {
      var s = snap.seatMap[seatIdx] || {};
      /* the hero row is shown so the sheet is the whole cast, but it is truly
         read-only: an editable row would run playerFor(name, true) on save and
         hand hero identity to whoever was typed into it */
      var inp = h('input', {
        class: 'input', value: s.name || '',
        placeholder: 'unnamed',
        disabled: s.hero ? 'disabled' : false,
        'aria-label': s.hero ? 'Your own seat'
          : 'Name for ' + snap.positions[seatIdx]
      });
      inputs[seatIdx] = inp;
      body.appendChild(h('div', { class: 'namerow' }, [
        h('span', { class: 'pos', text: snap.positions[seatIdx] }), inp
      ]));
    });
    openSheet(opts.title || 'Name players',
      opts.sub || 'Leave blank to keep the position as the name.', body, [
      opts.skipLabel ? h('button', {
        class: 'btn btn-ghost', text: opts.skipLabel,
        on: { click: closeSheet }
      }) : null,
      h('button', {
        class: 'btn btn-primary', text: opts.okLabel || 'Save names',
        on: {
          click: function () {
            var seen = {};
            var clash = null;
            Object.keys(inputs).forEach(function (k) {
              var nm = inputs[k].value.trim();
              if (!nm) return;
              var key = nm.toLowerCase();
              if (seen[key]) clash = nm;
              seen[key] = true;
            });
            if (clash) { toast(clash + ' cannot be in two seats.', 'warn'); return; }
            hd.seats.forEach(function (st) {
              var inp = inputs[st.seat];
              if (!inp) return;
              var nm = inp.value.trim();
              if (!nm) {
                if (!st.hero) { st.name = ''; st.playerId = null; }
                return;
              }
              var p = playerFor(nm, !!st.hero);
              st.playerId = p.id;
              st.name = p.name;
            });
            save(); closeSheet(); render();
          }
        }
      })
    ].filter(Boolean));
  }

  /* On saving a loose hand, ask who the opponents were while the hand is still
     fresh — that is the moment he knows, and a name is what makes the hand
     findable and countable against that player later. Only when somebody in the
     cast is still unnamed, so it never nags twice. */
  function offerNames(hd) {
    if (!hd.loose && !isLoose(session())) return;
    var snap = HR.replay(hd);
    var unnamed = nameableSeats(hd, snap).filter(function (i) {
      var s = snap.seatMap[i] || {};
      return !s.hero && !s.name;
    });
    if (!unnamed.length) return;
    setTimeout(function () {
      namePlayersSheet(hd, {
        title: 'Who was in it?',
        sub: 'Name them now and the hand counts against them later. Blank is fine.',
        okLabel: 'Save names',
        skipLabel: 'Not now'
      });
    }, 120);
  }

  /* Move a loose hand into a session. The hand keeps its own blinds, date and
     seats — it was recorded that way, and the app never rewrites recorded
     amounts. Only its number changes, to the next free one there. */
  function moveHandSheet(hd) {
    var from = session();
    var targets = realSessions();
    var body = h('div', {});
    if (!targets.length) {
      body.appendChild(h('p', {
        class: 'hint', text: 'No sessions yet. Create one and this hand can move into it.'
      }));
    } else {
      var list = h('div', { class: 'rowlist' });
      targets.forEach(function (t) {
        list.appendChild(h('button', {
          class: 'lrow',
          on: {
            click: function () {
              from.hands = from.hands.filter(function (x) { return x.id !== hd.id; });
              hd.no = nextHandNo(t);
              delete hd.loose;
              t.hands.unshift(hd);
              pruneLoose();
              save();
              closeSheet();
              toast('Moved to ' + t.venue + ' as hand ' + hd.no + '.', 'ok');
              replace(hd.complete ? 'result' : 'hand', { sessionId: t.id, handId: hd.id });
            }
          }
        }, [
          h('span', { class: 'g' }, [
            h('span', { class: 'a', text: t.venue }),
            h('span', {
              class: 'b',
              text: t.currency + num(t.sb) + '/' + num(t.bb) + ' · ' + t.date +
                ' · ' + t.hands.length + (t.hands.length === 1 ? ' hand' : ' hands')
            })
          ]),
          icon('caret-right', 16)
        ]));
      });
      body.appendChild(list);
    }
    openSheet('Move into a session', 'The hand keeps its own blinds and date.', body, null);
  }

  function sectionHead(label, right) {
    return h('div', { class: 'sechd' }, [
      h('span', { class: 'tag', text: label }),
      right ? h('span', { class: 'pos', text: right }) : null
    ].filter(Boolean));
  }

  /* ------------------------------------------------------- new session */

  function sessionForm(existing) {
    var prev = existing || realSessions()[0];

      class: 'input', value: prev ? prev.venue : '', placeholder: 'Home game, ClubGG…',
      'aria-label': 'Venue'
    });

      on: { click: function () { venue.value = ''; venue.focus(); drawClear(); } }
    }, [icon('x', 15)]);

    venue.addEventListener('input', drawClear);
    drawClear();

    var sb = h('input', {
      class: 'input', type: 'number', inputmode: 'decimal', min: '0',

    var main = h('div', {}, [

        h('label', { text: 'Venue' }),
        h('div', { class: 'inputwrap' }, [venue, venueClear])
      ]),
      h('div', { class: 'fieldrow', style: 'margin-top:12px' }, [

        h('div', { class: 'field' }, [h('label', { text: 'Date' }), date])
      ]),
      h('div', { class: 'fieldrow', style: 'margin-top:12px' }, [
        h('div', { class: 'field' }, [h('label', { text: 'Small blind' }), sb]),
        h('div', { class: 'field' }, [h('label', { text: 'Big blind' }), bb])
      ]),
      existing ? h('p', {
        class: 'hint',
        text: 'Applies to every hand already saved in this session. Amounts you ' +
          'recorded are untouched; only the stakes and the date change.'
      }) : null
    ].filter(Boolean));

    /* ------------------------------------------------ seat randomiser
       Type who is playing; the table is drawn for them when the session is
       created. Home games draw for seats — this is that draw, and it also means
       there is no seat-by-seat setup and no "mark your own seat" step. */
    var roll = [];
    /* which chip is him. Tracked by name rather than by position, so taking his
       own chip out cannot promote whoever he types next into the hero seat. */
    var heroSeed = me() ? me().name : 'EDB';
    var rollBox = h('div', { class: 'poschips' });
    var rollName = h('input', {
      class: 'input', placeholder: 'Name', 'aria-label': 'Player to seat'
    });
    var rollHint = h('p', { class: 'phint' });

    function drawRoll() {
      rollBox.innerHTML = '';
      roll.forEach(function (nm, i) {
        rollBox.appendChild(h('button', {
          class: 'chipbtn on', 'aria-label': 'Remove ' + nm,
          on: { click: function () { roll.splice(i, 1); drawRoll(); } }
        }, [h('span', { text: nm }), icon('x', 13)]));
      });
      var n = roll.length;
      rollHint.textContent = !n
        ? 'Nobody in the draw — you will seat the table yourself.'
        : n + (n === 1 ? ' player' : ' players') +
          ' — seats and the dealer button are drawn at random when you create the session.';
      if (n > Number(players.value)) players.value = String(Math.min(SEATS_MAX, n));
    }
    function addRoll() {
      var nm = rollName.value.trim();
      if (!nm) return;
      if (roll.length >= SEATS_MAX) { toast('That is a full table.'); return; }
      var dup = roll.filter(function (x) {
        return x.toLowerCase() === nm.toLowerCase();
      })[0];
      if (dup) { toast(dup + ' is already in.'); return; }
      roll.push(nm);
      rollName.value = '';
      rollName.focus();
      drawRoll();
    }
    rollName.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); addRoll(); }
    });

    if (!existing) {
      /* he is always in his own game — seeded so the hero seat needs no marking.
         On a first run there is no roster yet, so he goes in as EDB. */
      roll.push(heroSeed);
      drawRoll();
      main.appendChild(h('div', { class: 'hr' }));
      main.appendChild(sectionHead('Who is playing', 'seats drawn at random'));
      main.appendChild(h('div', { class: 'addrow' }, [
        rollName,
        h('button', { class: 'btn btn-ghost', text: 'Add', on: { click: addRoll } })
      ]));
      main.appendChild(rollBox);
      main.appendChild(rollHint);
    }

    function read() {
      var v = {
        venue: venue.value.trim() || 'Cash game',
        /* a NEW session takes currency and ante from settings; an EXISTING one
           keeps its own. Editing a venue typo must never rewrite the ante on
           every saved hand — antes are in the pot, so that would change
           recorded results. */
        currency: existing ? existing.currency : (db.settings.currency || 'HK$'),
        date: isoToDMY(date.value),
        sb: Number(sb.value),
        bb: Number(bb.value),
        ante: existing ? (existing.ante || 0)
          : (db.settings.anteOn ? (Number(db.settings.ante) || 0) : 0),
        players: Number(players.value) || 9,
        roll: roll.slice(),
        heroSeed: heroSeed
      };
      if (!(v.bb > 0)) { toast('Enter the big blind.'); bb.focus(); return null; }
      if (!(v.sb > 0)) v.sb = v.bb / 2;
      if (v.roll.length > v.players) v.players = Math.min(SEATS_MAX, v.roll.length);
      return v;
    }
    return { main: main, read: read };
  }

  function viewNewSession() {
    var f = sessionForm(null);
    return {
      top: { title: 'New session', back: true },
      main: f.main,
      cmd: [h('button', {
        class: 'btn btn-primary', text: 'Create session',
        on: {
          click: function () {
            var v = f.read();
            if (!v) return;
            newSession(v);
          }
        }
      })]
    };
  }

  function viewEditSession() {
    var s = session();
    if (!s) return viewSessions();
    var f = sessionForm(s);
    var main = h('div', {}, [f.main]);

    /* Who is where, and the way to change it. The draw seats everyone at the
       start; people then move — to get position, or because a chair opened up.
       Tap whoever is moving and pick where they go. */
    main.appendChild(h('div', { class: 'hr' }));
    main.appendChild(sectionHead('Seats', 'tap to move or swap'));
    var seated = seatedList(s);
    if (!seated.length) {
      main.appendChild(h('p', { class: 'hint', text: 'Nobody is seated yet.' }));
    } else {
      var pos = positionsOf(s, seated);
      var slist = h('div', { class: 'rowlist' });
      seated.forEach(function (x) {
        /* "BTN · button" says the same thing twice. The only table where the
           button is not on BTN is heads-up, where it sits on the small blind —
           and there the note earns its place. */
        var where = 'Seat ' + (x.seat + 1) +
          (pos[x.seat] ? ' · ' + pos[x.seat] : '') +
          (x.seat === s.buttonSeat && pos[x.seat] !== 'BTN' ? ' · button' : '');
        slist.appendChild(h('button', {
          class: 'lrow', on: { click: function () { seatMoveSheet(s, x.seat); } }
        }, [
          h('span', { class: 'g' }, [
            h('span', { class: 'a', text: rosterName(x.playerId) || 'Seat ' + (x.seat + 1) }),
            h('span', { class: 'b', text: where })
          ]),
          icon('caret-right', 18)
        ]));
      });
      main.appendChild(slist);
      main.appendChild(h('p', {
        class: 'hint',
        text: 'Hands already saved keep the seats they were played on. The button ' +
          'stays on its seat — move into it and you have the button.'
      }));
    }

    main.appendChild(h('div', { class: 'hr' }));
    /* somebody sat down mid-session: draw them a seat rather than making him
       find an empty anchor on the ring */
    main.appendChild(h('button', {
      class: 'btn btn-ghost joinact',
      on: { click: function () { joinSheet(s); } }
    }, [icon('plus', 16), h('span', { text: 'Someone joined' })]));
    main.appendChild(h('div', { class: 'hr' }));
    main.appendChild(h('button', {
      class: 'btn btn-ghost', style: 'width:100%;justify-content:center',
      on: {
        click: function () {
          confirmSheet('Delete this session?',
            s.hands.length + (s.hands.length === 1 ? ' hand' : ' hands') + ' go with it.',
            'Delete', function () {
              s.hands.forEach(function (hd) {
                if (hd.imageKey) IMG.del(hd.imageKey).catch(function () { });
              });
              db.sessions = db.sessions.filter(function (x) { return x.id !== s.id; });
              save(); replace('sessions');
            });
        }
      }
    }, [icon('trash', 18), h('span', { text: 'Delete session' })]));

    return {
      top: { title: 'Edit session', back: true },
      main: main,
      cmd: [h('button', {
        class: 'btn btn-primary', text: 'Save changes',
        on: {
          click: function () {
            var v = f.read();
            if (!v) return;
            var highest = seatedList(s).reduce(function (t, x) { return Math.max(t, x.seat); }, -1);
            if (v.players <= highest) {
              toast('Empty a seat first — ' + (highest + 1) + ' are in use.', 'warn', 4000);
              return;
            }
            s.venue = v.venue; s.currency = v.currency; s.date = v.date;
            s.sb = v.sb; s.bb = v.bb; s.ante = v.ante; s.players = v.players;
            s.hands.forEach(function (hd) {
              hd.venue = v.venue; hd.currency = v.currency; hd.date = v.date;
              hd.sb = v.sb; hd.bb = v.bb; hd.ante = v.ante;
            });
            save();
            replace('session', { sessionId: s.id });
            toast('Session updated.', 'ok');
          }
        }
      })]
    };
  }

  /* ---------------------------------------------------------- session */

  /* One row per hand: number, the hands that contested the pot, your position
     and your net. Shared by a session and by the loose container. */
  function handList(s) {
    var list = h('div', { class: 'rowlist' });
    s.hands.forEach(function (hd) {
      var snap = HR.replay(hd);
      var res = HR.settle(hd, snap, hd.winners);
      var n = snap.heroSeat == null ? 0 : res.net[snap.heroSeat];
      var shown = contestedHands(hd, snap);
      var extra = Math.max(0, shown.length - 2);
      var handsEl = h('span', { class: 'hands' }, []);
      shown.slice(0, 2).forEach(function (c, i) {
        /* a "v" between the two hands — four cards in a row with only a gap
           between them reads as one hand */
        if (i) handsEl.appendChild(h('span', { class: 'vs', text: 'v' }));
        handsEl.appendChild(c ? cardsEl(c, 'sm') : unknownEl('sm'));
      });
      if (extra) handsEl.appendChild(h('span', { class: 'pos', text: '+' + extra }));
      list.appendChild(h('button', {
        class: 'lrow',
        on: {
          click: function () {
            go(hd.complete ? 'result' : 'hand', { sessionId: s.id, handId: hd.id });
          }
        }
      }, [
        h('span', { class: 'pos', text: '#' + hd.no }),
        shown.length ? handsEl : h('span', { class: 'pos', text: '··' }),
        h('span', { class: 'g' }, [
          h('span', {
            class: 'a',
            text: snap.heroSeat == null ? ''
              : (hd.heroCardsNA ? 'Not my hand' : snap.positions[snap.heroSeat])
          }),
          h('span', {
            class: 'b',
            text: hd.complete
              ? (snap.n + ' handed · ' + hd.currency + num(hd.sb) + '/' + num(hd.bb) +
                ' · pot ' + num(snap.pot))
              : 'In progress'
          })
        ]),
        hd.complete ? h('span', {
          class: 'n ' + (n > 0 ? 'up' : n < 0 ? 'down' : ''),
          text: (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n))
        }) : icon('caret-right', 16)
      ]));
    });
    return list;
  }

  function viewSession() {
    var s = session();
    if (!s) return viewSessions();
    var seats = seatedList(s);
    var main = h('div', {});
    var net = sessionNet(s);

    /* the loose container has no table to seat — it is a list of hands and
       nothing else */
    if (isLoose(s)) {
      main.appendChild(sectionHead('Hands', s.hands.length + ''));
      main.appendChild(s.hands.length ? handList(s) : h('div', { class: 'empty' }, [
        h('h3', { text: 'No loose hands' }),
        h('p', { text: 'Add one on positions alone. It can move into a session later.' })
      ]));
      return {
        top: {
          title: 'Loose hands', back: true,
          sub: s.hands.length + (s.hands.length === 1 ? ' hand' : ' hands') +
            ' · net <span class="num">' +
            (net > 0 ? '+' : net < 0 ? '−' : '') + num(Math.abs(net)) + '</span>'
        },
        main: main,
        cmd: [h('button', {
          class: 'btn btn-primary', text: 'Add hand', on: { click: quickHandSheet }
        })]
      };
    }

    var positions = positionsOf(s, seats);

    main.appendChild(ringEl({
      seats: seats.map(function (x) {
        return {
          seat: x.seat, stack: x.stack, name: rosterName(x.playerId),
          hero: !!(me() && x.playerId === me().id)
        };
      }),
      buttonSeat: s.buttonSeat,
      players: s.players || SEATS_MAX,
      editable: true, showEmpty: true,
      /* a seating-only snapshot: enough for positions, no hand in progress */
      snap: seats.length >= 2
        ? { positions: positions, folded: {}, allin: {}, contrib: {}, streets: [], next: null }
        : null,
      onSeat: seatSheet,
      onButton: function (seatIdx) { s.buttonSeat = seatIdx; save(); render(); },
      centre: h('div', { class: 'mid' }, [
        h('span', { class: 'potl', text: seats.length ? seats.length + ' seated' : 'Tap a seat' }),
        h('span', { class: 'potn', text: s.currency + num(s.sb) + '/' + num(s.bb) })
      ])
    }));

    var hasHero = seats.some(function (x) { return me() && x.playerId === me().id; });
    if (!hasHero && seats.length) {
      main.appendChild(h('p', {
        class: 'hint', text: 'Tap your own seat and choose “This is me”.'
      }));
    }

    var done = s.hands.filter(function (x) { return x.complete; });
    main.appendChild(sectionHead('Hands', done.length + ' of ' + s.hands.length + ' saved'));
    main.appendChild(s.hands.length ? handList(s) : h('div', { class: 'empty' }, [
      h('h3', { text: 'No hands yet' }),
      h('p', { text: 'Recall one street at a time. It saves as you go.' })
    ]));
    if (done.length) {
      main.appendChild(h('button', {
        class: 'btn btn-ghost joinact', style: 'margin-top:12px',
        on: { click: function () { exportSessionSheet(s); } }
      }, [icon('upload-simple', 16), h('span', { text: 'Export this session' })]));
    }

    return {
      top: {
        title: s.venue, back: true,
        extra: h('button', {
          class: 'icon-btn', 'aria-label': 'Edit session',
          on: { click: function () { go('editsession', { sessionId: s.id }); } }
        }, [icon('note-pencil', 17)]),
        sub: s.currency + num(s.sb) + '/' + num(s.bb) + ' · ' + s.date +
          ' · net <span class="num">' + (net > 0 ? '+' : net < 0 ? '−' : '') + num(Math.abs(net)) + '</span>'
      },
      main: main,
      cmd: [h('button', {
        class: 'btn btn-primary', on: { click: startHand }
      }, [icon('plus', 18), h('span', { text: 'New hand' })])]
    };
  }

  /* ------------------------------------------------------------- hand */

  function viewHand() {
    var s = session(), hd = hand();
    if (!s || !hd) return viewSessions();
    if (hd.complete) return viewResult();

    var snap = HR.replay(hd);
    var main = h('div', {});
    var heroHole = (hd.hole || {})[snap.heroSeat] || [];

    /* hole cards + street strip */
    main.appendChild(h('div', { class: 'sechd' }, [
      h('span', { class: 'tag', text: 'Your cards' }),
      h('button', {
        class: 'cardbtn', 'aria-label': 'Set your cards',
        on: { click: function () { askHole(hd); } }
      }, [
        heroHole.length ? cardsEl(heroHole)
          : hd.heroCardsNA ? h('span', { class: 'pos', text: 'Not relevant' })
            : cardsEl([null, null])
      ])
    ]));

    /* ring — tapping a player hands them the action; everyone stepped over is
       recorded as a check or a fold. The button stays draggable until the first
       action is in, since moving it after that would rewrite the order. */
    var targets = skipTargets(snap);
    var orderLocked = hd.actions.length > 0;
    main.appendChild(ringEl({
      seats: hd.seats, buttonSeat: hd.buttonSeat, snap: snap, hole: hd.hole,
      players: hd.players || (session() || {}).players || SEATS_MAX,
      targets: targets,
      editable: !orderLocked,
      onButton: !orderLocked ? function (seatIdx) {
        hd.buttonSeat = seatIdx;
        var live = session();
        if (live) live.buttonSeat = seatIdx;
        save(); render();
      } : null,
      onSeat: function (seatIdx) {
        if (targets[seatIdx]) { skipTo(hd, seatIdx); return; }
        if (snap.next.type === 'action' && seatIdx === snap.next.seat) {
          seatInHandSheet(hd, snap, seatIdx); return;
        }
        if (snap.folded[seatIdx]) {
          toast(seatLabel(snap.seatMap[seatIdx], snap) + ' is out of this hand.'); return;
        }
        seatInHandSheet(hd, snap, seatIdx);
      },
      centre: h('div', { class: 'mid' }, [
        boardOnFelt(hd, snap),
        h('span', {
          class: 'potn', text: num(snap.pot), 'aria-label': 'Pot ' + num(snap.pot)
        })
      ])
    }));

    if (snap.next.type === 'action') {
      main.appendChild(h('p', {
        class: 'hint',
        text: orderLocked
          ? 'Tap whoever acts next — anyone skipped is recorded as a ' +
            (HR.legalFor(hd, snap, snap.next.seat).toCall > 0 ? 'fold.' : 'check.')
          : 'Drag the D to set the button, then tap whoever acts first.'
      }));
    }

    /* action panel */
    if (snap.next.type === 'action') {
      main.appendChild(actionPanel(hd, snap));
    } else if (snap.next.type === 'board') {
      main.appendChild(h('div', { class: 'actor' }, [
        h('div', { class: 'who' }, [h('b', { text: ['', 'Flop', 'Turn', 'River'][snap.next.street] })]),
        h('div', { class: 'facts' }, [
          h('span', { text: snap.next.runout ? 'All-in — run it out.' : 'Betting is closed.' })
        ]),
        h('div', { class: 'acts' }, [
          h('button', {
            class: 'btn btn-primary wide',
            text: 'Enter the ' + ['', 'flop', 'turn', 'river'][snap.next.street],
            on: { click: function () { askBoard(hd, snap.next.street); } }
          })
        ])
      ]));
    }

    /* action log */
    if (hd.actions.length) {
      main.appendChild(sectionHead('Action'));
      main.appendChild(logEl(hd, snap, 6));
    }

    var cmd = [];
    cmd.push(h('button', {
      class: 'btn btn-ghost slim', 'aria-label': 'Undo',
      disabled: !hd.actions.length && !hd.boards[1].length,
      on: { click: function () { undo(hd); } }
    }, [icon('arrow-counter-clockwise', 18)]));

    if (snap.next.type === 'showdown') {
      cmd.push(h('button', {
        class: 'btn btn-primary', text: 'Showdown', on: { click: function () { askShowdown(hd); } }
      }));
    } else if (snap.next.type === 'done') {
      cmd.push(h('button', {
        class: 'btn btn-primary', text: 'Save hand', on: { click: function () { finishByFolds(hd); } }
      }));
    } else if (snap.next.type === 'board') {
      cmd.push(h('button', {
        class: 'btn btn-primary',
        text: 'Enter the ' + ['', 'flop', 'turn', 'river'][snap.next.street],
        on: { click: function () { askBoard(hd, snap.next.street); } }
      }));
    } else {
      cmd.push(h('button', {
        class: 'btn btn-ghost', text: 'Discard hand',
        on: {
          click: function () {
            confirmSheet('Discard hand ' + hd.no + '?', 'The actions entered so far are lost.',
              'Discard', function () {
                s.hands = s.hands.filter(function (x) { return x.id !== hd.id; });
                save(); replace('session', { sessionId: s.id });
              });
          }
        }
      }));
    }

    return {
      top: {
        title: isLoose(s) ? 'Loose hand' : 'Hand ' + hd.no, back: true,
        /* recorded on positions: names are optional and go on whenever he knows
           them, so the way in stays one tap from the hand itself */
        extra: isLoose(s) ? h('button', {
          class: 'icon-btn', 'aria-label': 'Name players',
          on: { click: function () { namePlayersSheet(hd); } }
        }, [icon('note-pencil', 17)]) : null,
        sub: hd.currency + num(hd.sb) + '/' + num(hd.bb) + ' · ' +
          ['preflop', 'flop', 'turn', 'river'][
            snap.streets.length ? snap.streets[snap.streets.length - 1].street : 0] +
          ' · pot <span class="num">' + num(snap.pot) + '</span> · ' + snap.n + ' handed' +
          /* a straddle changes the action order, so it belongs where he can
             see it without opening anything */
          (snap.straddle ? ' · ' + snap.positions[snap.straddle.seat] +
            ' straddle <span class="num">' + num(snap.straddle.amount) + '</span>' : '')
      },
      main: main, cmd: cmd
    };
  }

  /* The board sits on the felt, flop then turn then river, left to right with a
     wider gap between streets so the groups read without labels. Each group is
     tappable: filled ones to correct a card, the next one due to deal it. */
  function boardOnFelt(hd, snap) {
    var wrap = h('div', { class: 'board' });
    var due = snap.next.type === 'board' ? snap.next.street : null;
    [1, 2, 3].forEach(function (st) {
      var cards = hd.boards[st] || [];
      var count = HR.BOARD_COUNT[st];
      var isDue = due === st;
      /* empty slots only for the street actually due — placeholders for streets
         that may never come are noise */
      if (!cards.length && !isDue) return;
      var name = ['', 'flop', 'turn', 'river'][st];
      var kids = [];
      for (var i = 0; i < count; i++) kids.push(cardEl(cards[i], 'brd'));
      wrap.appendChild(h('button', {
        class: 'bgrp' + (cards.length ? '' : ' due'),
        'aria-label': cards.length ? 'Change the ' + name : 'Enter the ' + name,
        disabled: !cards.length && !isDue,
        on: {
          click: function (ev) {
            ev.stopPropagation();
            if (cards.length || isDue) askBoard(hd, st);
          }
        }
      }, kids));
    });
    return wrap;
  }

  function logEl(hd, snap, limit) {
    var rows = [];
    snap.streets.forEach(function (st) {
      st.actions.forEach(function (a) {
        var s = snap.seatMap[a.seat] || {};
        var verb = a.act === 'check' ? 'checks'
          : a.act === 'fold' ? 'folds'
            : a.act === 'call' ? 'calls ' + num(a.to)
              : a.act === 'allin' ? 'all-in ' + num(a.to)
                : (a.act === 'bet' ? 'bets ' : 'raises to ') + num(a.to);
        rows.push({ k: HR.STREET_TAG[st.street], t: seatLabel(s, snap) + ' ' + verb });
      });
    });
    var shown = limit ? rows.slice(-limit) : rows;
    var box = h('div', { class: 'log' }, shown.map(function (r) {
      return h('div', { class: 'l' }, [
        h('span', { class: 'k', text: r.k }), h('span', { class: 't', text: r.t })
      ]);
    }));
    if (limit && rows.length > limit) {
      box.appendChild(h('button', {
        class: 'chipbtn', style: 'margin-top:8px', text: 'All ' + rows.length + ' actions',
        on: { click: function () { openSheet('Action', null, logEl(hd, snap, 0)); } }
      }));
    }
    return box;
  }

  function seatInHandSheet(hd, snap, seatIdx) {
    var s = snap.seatMap[seatIdx];
    if (!s) return;
    var cards = (hd.hole || {})[seatIdx] || [];
    var body = h('div', { class: 'rowlist' }, [
      h('button', {
        class: 'lrow', on: {
          click: function () {
            pickCards({
              title: (s.hero ? 'Your cards' : seatLabel(s, snap) + '’s cards'), count: 2,
              allowUnknown: true, used: usedCards(hd, seatIdx), initial: cards,
              onDone: function (c) { hd.hole = hd.hole || {}; hd.hole[seatIdx] = c; save(); render(); }
            });
          }
        }
      }, [
        h('span', { class: 'g' }, [
          h('span', { class: 'a', text: 'Cards' }),
          h('span', { class: 'b', text: cards.length ? HR.cardsGlyph(cards, ' ') : 'Not shown' })
        ]), icon('caret-right', 18)
      ]),
      h('button', {
        class: 'lrow', on: {
          click: function () {
            keypad({
              title: 'Stack — ' + seatLabel(s, snap), currency: hd.currency,
              value: s.stack || '',
              onDone: function (n) {
                s.stack = n;
                var live = session().seats.filter(function (x) { return x.seat === seatIdx; })[0];
                if (live) live.stack = n;
                save(); render();
              }
            });
          }
        }
      }, [
        h('span', { class: 'g' }, [
          h('span', { class: 'a', text: 'Starting stack' }),
          h('span', { class: 'b', text: s.stack == null ? 'Not set' : hd.currency + num(s.stack) })
        ]), icon('caret-right', 18)
      ])
    ]);
    openSheet(seatLabel(s, snap) + ' · ' + snap.positions[seatIdx], null, body);
  }

  /* ------------------------------------------------------ action panel */

  function actionPanel(hd, snap) {
    var seat = snap.next.seat;
    var lg = HR.legalFor(hd, snap, seat);
    var s = snap.seatMap[seat];
    var isHero = seat === snap.heroSeat;
    var cur = hd.currency;

    function push(act, to) { pushAction(hd, { street: snap.next.street, seat: seat, act: act, to: to }); }

    var acts = h('div', { class: 'acts' });
    acts.appendChild(h('button', {
      class: 'btn btn-ghost', text: 'Fold', on: { click: function () { push('fold'); } }
    }));
    if (lg.canCheck) {
      acts.appendChild(h('button', {
        class: 'btn btn-primary', text: 'Check', on: { click: function () { push('check'); } }
      }));
    } else {
      acts.appendChild(h('button', {
        class: 'btn btn-primary', text: 'Call ' + num(lg.toCall),
        on: { click: function () { push('call', lg.callTo); } }
      }));
    }
    acts.appendChild(h('button', {
      class: 'btn btn-ghost', text: (lg.isRaise ? 'Raise to…' : 'Bet…'),
      on: {
        click: function () {
          keypad({
            title: (lg.isRaise ? 'Raise to' : 'Bet'),
            sub: seatLabel(s, snap) + ' · ' + snap.positions[seat],
            currency: cur,
            min: lg.isRaise ? lg.minRaiseTo : hd.bb,
            meta: [['Pot', num(lg.pot)], ['To call', num(lg.toCall)],
            ['Stack', lg.stackLeft == null ? '—' : num(lg.stackLeft)]],
            onDone: function (n) { push(lg.isRaise ? 'raise' : 'bet', n); }
          });
        }
      }
    }));
    acts.appendChild(h('button', {
      class: 'btn btn-ghost',
      text: lg.allInTo == null ? 'All-in…' : 'All-in ' + num(lg.allInTo),
      on: {
        click: function () {
          if (lg.allInTo != null) { push('allin', lg.allInTo); return; }
          keypad({
            title: 'All-in for', sub: 'Stack not set — enter the total.', currency: cur,
            meta: [['Pot', num(lg.pot)], ['To call', num(lg.toCall)]],
            onDone: function (n) {
              s.stack = (snap.contrib[seat] || 0) - lg.committed + n;
              var live = session().seats.filter(function (x) { return x.seat === seat; })[0];
              if (live) live.stack = s.stack;
              push('allin', n);
            }
          });
        }
      }
    }));
    /* only meaningful when there is a bet for them to fold to */
    if (!isHero && snap.live.length > 2 && lg.toCall > 0) {
      acts.appendChild(h('button', {
        class: 'btn btn-ghost wide', text: 'Everyone else folds',
        on: { click: function () { skipTo(hd, null); } }
      }));
    }

    return h('div', { class: 'actor' }, [
      h('div', { class: 'who' }, [
        h('b', { text: seatLabel(s, snap) }),
        h('span', { class: 'pos', text: snap.positions[seat] }),
        h('button', {
          class: 'icon-btn tiny', 'aria-label': 'Cards and stack for ' + seatLabel(s, snap),
          on: { click: function () { seatInHandSheet(hd, snap, seat); } }
        }, [icon('note-pencil', 15)])
      ]),
      h('div', { class: 'facts' }, [
        h('span', { html: 'To call <b>' + num(lg.toCall) + '</b>' }),
        h('span', { html: 'Pot <b>' + num(lg.pot) + '</b>' }),
        h('span', { html: 'Behind <b>' + (lg.stackLeft == null ? '—' : num(lg.stackLeft)) + '</b>' })
      ]),
      acts
    ]);
  }

  /* ------------------------------------------------------------ result */

  function viewResult() {
    var s = session(), hd = hand();
    if (!s || !hd) return viewSessions();
    var snap = HR.replay(hd);
    var res = HR.settle(hd, snap, hd.winners);
    var net = snap.heroSeat == null ? 0 : res.net[snap.heroSeat];
    var main = h('div', {});

    main.appendChild(h('div', { class: 'grid2' }, [
      h('div', { class: 'statcard' }, [
        h('span', { class: 'l', text: 'Pot' }),
        h('span', { class: 'n', text: num(snap.pot) }),
        /* say so rather than leaving him to wonder why the pot is smaller than
           the chips he saw go in */
        snap.uncalled > 0 ? h('span', {
          class: 'cap',
          text: num(snap.uncalled) + ' back to ' +
            ((snap.seatMap[snap.uncalledSeat] || {}).name || 'the bettor')
        }) : null
      ].filter(Boolean)),
      h('div', { class: 'statcard' }, [
        h('span', { class: 'l', text: 'Net for ' + heroName() }),
        h('span', {
          class: 'n ' + (net > 0 ? 'up' : net < 0 ? 'down' : ''),
          text: (net > 0 ? '+' : net < 0 ? '−' : '') + num(Math.abs(net))
        })
      ])
    ]));

    /* board + hands */
    main.appendChild(sectionHead('Board'));
    var board = [].concat(hd.boards[1] || [], hd.boards[2] || [], hd.boards[3] || []);
    main.appendChild(h('div', { class: 'cardrow' },
      board.length ? board.map(function (c) { return cardEl(c); })
        : [h('span', { class: 'pos', text: 'No board — the hand ended preflop.' })]));

    main.appendChild(sectionHead('Hands'));
    var shownRows = h('div', { class: 'rowlist' });
    snap.order.forEach(function (seatIdx) {
      var p = snap.seatMap[seatIdx];
      var cards = (hd.hole || {})[seatIdx] || [];
      var live = snap.live.indexOf(seatIdx) >= 0;
      /* everyone who got to the end, plus you — an unshown hand is a question
         mark, not a missing row */
      if (!cards.length && !live && !(p.hero && !hd.heroCardsNA)) return;
      var n = res.net[seatIdx] || 0;
      shownRows.appendChild(h('button', {
        class: 'lrow',
        on: {
          click: function () {
            pickCards({
              title: (p.hero ? 'Your cards' : seatLabel(p, snap) + '’s cards'), count: 2,
              allowUnknown: true, used: usedCards(hd, seatIdx), initial: cards,
              onDone: function (c) { hd.hole = hd.hole || {}; hd.hole[seatIdx] = c; save(); render(); }
            });
          }
        }
      }, [
        cards.length ? cardsEl(cards, 'sm')
          : (live ? unknownEl('sm') : h('span', { class: 'pos', text: '··' })),
        h('span', { class: 'g' }, [
          h('span', { class: 'a', text: seatLabel(p, snap) }),
          h('span', { class: 'b', text: snap.positions[seatIdx] + (snap.folded[seatIdx] ? ' · folded' : '') })
        ]),
        h('span', {
          class: 'n ' + (n > 0 ? 'up' : n < 0 ? 'down' : ''),
          text: (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n))
        })
      ]));
    });
    main.appendChild(shownRows);

    /* shareable text */
    var text = HR.toText(hd, { note: db.settings.shareNote });
    main.appendChild(sectionHead('For WhatsApp'));
    main.appendChild(h('div', { class: 'out', text: HR.toText(hd, { fence: false, note: db.settings.shareNote }) }));
    main.appendChild(h('div', { class: 'outbtns' }, [
      h('button', {
        class: 'btn btn-primary', on: { click: function () { copyText(text); } }
      }, [icon('copy-simple', 18), h('span', { text: 'Copy' })]),
      h('button', {
        class: 'btn btn-ghost', on: { click: function () { shareText(hd, text); } }
      }, [icon('whatsapp-logo', 18), h('span', { text: 'Share' })]),
      h('button', {
        class: 'btn btn-ghost', on: { click: function () { showImage(hd); } }
      }, [icon('image', 18), h('span', { text: 'Picture' })]),
      h('button', {
        class: 'btn btn-ghost', on: { click: function () { copyText(JSON.stringify(HR.handRecord(hd), null, 2)); } }
      }, [icon('terminal-window', 18), h('span', { text: 'Copy JSON' })])
    ]));

    /* note */
    main.appendChild(sectionHead('Note'));
    var note = h('textarea', {
      class: 'textarea', placeholder: 'What were you thinking? What would you do differently?',
      'aria-label': 'Note'
    });
    note.value = hd.note || '';
    note.addEventListener('input', function () { hd.note = note.value; save(); });
    note.addEventListener('blur', function () { render(); });
    main.appendChild(note);

    /* screenshot */
    main.appendChild(sectionHead('Screenshot'));
    var shotBox = h('div', {});
    main.appendChild(shotBox);
    drawShot();
    function drawShot() {
      shotBox.innerHTML = '';
      if (hd.imageKey) {
        IMG.get(hd.imageKey).then(function (dataUrl) {
          if (!dataUrl) { hd.imageKey = null; save(); drawShot(); return; }
          shotBox.innerHTML = '';
          shotBox.appendChild(h('img', { class: 'shot', src: dataUrl, alt: 'Hand screenshot' }));
          shotBox.appendChild(h('button', {
            class: 'chipbtn', style: 'margin-top:8px', text: 'Remove',
            on: {
              click: function () {
                IMG.del(hd.imageKey).catch(function () { });
                hd.imageKey = null; save(); drawShot();
              }
            }
          }));
        }).catch(function () {
          shotBox.textContent = '';
          shotBox.appendChild(h('p', { class: 'hint', text: 'Screenshot store unavailable on this device.' }));
        });
        return;
      }
      var file = h('input', {
        type: 'file', accept: 'image/*', style: 'display:none', 'aria-hidden': 'true'
      });
      file.addEventListener('change', function () {
        var f = file.files && file.files[0];
        if (!f) return;
        shrinkImage(f, 1280, 0.75).then(function (dataUrl) {
          var key = uid('img');
          return IMG.put(key, dataUrl).then(function () {
            hd.imageKey = key; save(); drawShot();
          });
        }).catch(function () { toast('Could not attach that image.', 'warn'); });
      });
      shotBox.appendChild(file);
      shotBox.appendChild(h('button', {
        class: 'btn btn-ghost', style: 'width:100%;justify-content:center;min-height:48px',
        on: { click: function () { file.click(); } }
      }, [icon('camera', 18), h('span', { text: 'Attach a screenshot' })]));
    }

    main.appendChild(h('div', { class: 'hr' }));
    /* a loose hand can be filed later — the point of recording it without one */
    if (isLoose(s)) {
      main.appendChild(h('button', {
        class: 'btn btn-ghost', style: 'width:100%;justify-content:center',
        on: { click: function () { moveHandSheet(hd); } }
      }, [icon('folder-plus', 18), h('span', { text: 'Move into a session' })]));
      main.appendChild(h('div', { class: 'hr' }));
    }
    main.appendChild(h('button', {
      class: 'btn btn-ghost', style: 'width:100%;justify-content:center',
      on: {
        click: function () {
          confirmSheet('Delete this hand?', 'This cannot be undone.', 'Delete', function () {
            if (hd.imageKey) IMG.del(hd.imageKey).catch(function () { });
            s.hands = s.hands.filter(function (x) { return x.id !== hd.id; });
            var wasLoose = isLoose(s);
            pruneLoose();
            save();
            if (wasLoose && !db.sessions.filter(isLoose).length) replace('sessions');
            else replace('session', { sessionId: s.id });
          });
        }
      }
    }, [icon('trash', 18), h('span', { text: 'Delete hand' })]));

    return {
      top: {
        title: isLoose(s) ? 'Loose hand' : 'Hand ' + hd.no, back: true,
        extra: isLoose(s) ? h('button', {
          class: 'icon-btn', 'aria-label': 'Name players',
          on: { click: function () { namePlayersSheet(hd); } }
        }, [icon('note-pencil', 17)]) : null,
        sub: hd.currency + num(hd.sb) + '/' + num(hd.bb) + ' · ' + snap.n + ' handed · ' + hd.date +
          (snap.straddle ? ' · ' + snap.positions[snap.straddle.seat] + ' straddle' : '')
      },
      main: main,
      cmd: [
        h('button', {
          class: 'btn btn-ghost', text: 'Session',
          on: { click: function () { replace('session', { sessionId: s.id }); } }
        }),
        h('button', {
          class: 'btn btn-primary', on: { click: function () { replace('session', { sessionId: s.id }); startHand(); } }
        }, [icon('plus', 18), h('span', { text: 'Next hand' })])
      ]
    };
  }

  /* ------------------------------------------------------------ sharing */

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('Copied.', 'ok'); },
        function () { fallbackCopy(t); });
    } else fallbackCopy(t);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { }
    ta.remove();
    toast(ok ? 'Copied.' : 'Copy failed — select the text and copy it by hand.', ok ? 'ok' : 'warn');
  }
  function shareText(hd, text) {
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { });
      return;
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  function shrinkImage(file, maxPx, quality) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var sc = Math.min(1, maxPx / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = rej;
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  function showImage(hd) {
    var body = h('div', {});
    var canvas = window.renderHandImage(hd, db.settings.imageStyle);
    var img = h('img', { class: 'imgprev', src: canvas.toDataURL('image/png'), alt: 'Hand picture' });
    body.appendChild(img);
    var styleSeg = h('div', { class: 'segmented', style: 'margin-top:12px' });
    [['card', 'Card'], ['table', 'Table']].forEach(function (m) {
      styleSeg.appendChild(h('button', {
        class: db.settings.imageStyle === m[0] ? 'active' : '', text: m[1],
        on: {
          click: function () {
            db.settings.imageStyle = m[0]; save();
            closeSheet(); showImage(hd);
          }
        }
      }));
    });
    body.appendChild(styleSeg);

    openSheet('Hand ' + hd.no, 'Same hand, two layouts. Pick one — it becomes the default.', body, [
      h('button', {
        class: 'btn btn-ghost', text: 'Download',
        on: {
          click: function () {
            canvas.toBlob(function (b) {
              downloadBlob(b, 'hand-' + hd.no + '-' + (hd.date || '').replace(/\//g, '-') + '.png');
            }, 'image/png');
          }
        }
      }),
      h('button', {
        class: 'btn btn-primary', text: 'Share',
        on: {
          click: function () {
            canvas.toBlob(function (b) {
              var file = new File([b], 'hand-' + hd.no + '.png', { type: 'image/png' });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file] }).catch(function () { });
              } else {
                downloadBlob(b, 'hand-' + hd.no + '.png');
                toast('Saved the picture — attach it from your photos.');
              }
            }, 'image/png');
          }
        }
      })
    ]);
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ------------------------------------------------------------- export */

  function bundle() {
    return {
      app: 'edb-hand-recall',
      appVersion: APP_VERSION,
      schema: 1,
      exportedAt: new Date().toISOString(),
      roster: db.roster.map(function (r) { return { id: r.id, name: r.name, isHero: !!r.me }; }),
      sessions: db.sessions.map(oneSessionRecord)
    };
  }

  function oneSessionRecord(s) {
    return {
      id: s.id, date: s.date, venue: s.venue, currency: s.currency,
      sb: s.sb, bb: s.bb, ante: s.ante || 0,
      seats: seatedList(s).map(function (x) {
        return { seat: x.seat, playerId: x.playerId, name: rosterName(x.playerId), stack: x.stack };
      }),
      hands: s.hands.filter(function (hd) { return hd.complete; })
        .slice().sort(function (a, b) { return a.no - b.no; })
        .map(function (hd) { return HR.handRecord(hd); })
    };
  }

  /* ------------------------------------------------- one session, exported
     Built against the poker ledger's real importer (`src/parse.js`), not a
     guess at it:

     · TEXT — every saved hand's compact log, in order, unfenced. The ledger
       splits a paste into hands on the header line and files the whole paste as
       one night, which is exactly one session. The **venue rides on the header**
       here (it never does in a shared hand) because that is the only place the
       ledger can read it from.
     · JSON — the same bundle shape as Export everything, carrying one session
       and only the players who appear in it, so the ledger's roster
       reconciliation has nothing spurious to match.
     · CSV — one row per action, the same columns as the full export. */

  function sessionText(s) {
    var hands = s.hands.filter(function (hd) { return hd.complete; })
      .slice().sort(function (a, b) { return a.no - b.no; });
    return hands.map(function (hd) {
      return HR.toText(hd, { fence: false, venue: s.venue || '', note: db.settings.shareNote });
    }).join('\n\n');
  }

  function sessionBundle(s) {
    var used = {};
    seatedList(s).forEach(function (x) { if (x.playerId) used[x.playerId] = true; });
    s.hands.forEach(function (hd) {
      (hd.seats || []).forEach(function (x) { if (x.playerId) used[x.playerId] = true; });
    });
    return {
      app: 'edb-hand-recall',
      appVersion: APP_VERSION,
      schema: 1,
      scope: 'session',
      exportedAt: new Date().toISOString(),
      roster: db.roster.filter(function (r) { return used[r.id]; })
        .map(function (r) { return { id: r.id, name: r.name, isHero: !!r.me }; }),
      sessions: [oneSessionRecord(s)]
    };
  }

  function slug(str) {
    return String(str || 'session').toLowerCase().replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '').slice(0, 40) || 'session';
  }
  function sessionStamp(s) {
    return slug(s.venue) + '-' + dmyToISO(s.date || '').replace(/-/g, '');
  }

  function exportSessionSheet(s) {
    var done = s.hands.filter(function (hd) { return hd.complete; });
    var body = h('div', {});
    if (!done.length) {
      body.appendChild(h('p', { class: 'hint', text: 'No saved hands in this session yet.' }));
      openSheet('Export this session', null, body, null);
      return;
    }
    var rows = h('div', { class: 'rowlist' });
    function row(title, sub, ic, fn) {
      rows.appendChild(h('button', { class: 'lrow', on: { click: fn } }, [
        icon(ic, 18),
        h('span', { class: 'g' }, [
          h('span', { class: 'a', text: title }),
          h('span', { class: 'b', text: sub })
        ]),
        icon('caret-right', 16)
      ]));
    }
    row('Copy the hands as text',
      done.length + (done.length === 1 ? ' hand' : ' hands') + ' · the ledger reads this',
      'copy-simple',
      function () { copyText(sessionText(s)); closeSheet(); });
    row('Text file', 'the same thing, as a file', 'download-simple', function () {
      downloadBlob(new Blob([sessionText(s)], { type: 'text/plain' }),
        'hands-' + sessionStamp(s) + '.txt');
      toast('Exported.', 'ok'); closeSheet();
    });
    row('JSON', 'full detail — stacks, actions, ids', 'download-simple', function () {
      downloadBlob(new Blob([JSON.stringify(sessionBundle(s), null, 2)],
        { type: 'application/json' }), 'hands-' + sessionStamp(s) + '.json');
      toast('Exported.', 'ok'); closeSheet();
    });
    row('CSV', 'one row per action', 'table', function () {
      downloadBlob(new Blob([csvFor([s])], { type: 'text/csv' }),
        'hands-' + sessionStamp(s) + '.csv');
      toast('Exported.', 'ok'); closeSheet();
    });
    body.appendChild(rows);
    body.appendChild(h('p', {
      class: 'hint',
      text: 'Text carries the night and every hand in it; JSON carries the same ' +
        'hands with the stacks, the player ids and every action.'
    }));
    openSheet('Export this session', s.venue + ' · ' + s.date, body, null);
  }

  /* the readable export doubles as the backup — _restore holds the raw state so
     importing the same file actually puts everything back */
  function backupPayload() {
    var payload = bundle();
    payload._restore = db;
    return payload;
  }
  function restoreFrom(parsed) {
    var state = (parsed && parsed._restore) ? parsed._restore
      : (parsed && parsed.v && parsed.sessions) ? parsed : null;
    if (!state) return false;
    db = state;
    db.roster = db.roster || [];
    db.sessions = db.sessions || [];
    db.settings = db.settings || { imageStyle: 'card', shareNote: false };
    save();
    return true;
  }

  function exportJSON() {
    var b = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' });
    downloadBlob(b, 'hand-recall-' + todayISO() + '.json');
    toast('Exported.', 'ok');
  }

  /* one CSV body from any list of app sessions — the whole log, or just one */
  function csvFor(list) {
    var cols = ['session_id', 'venue', 'date', 'currency', 'sb', 'bb', 'hand_id', 'hand_no',
      'table_size', 'straddle', 'straddle_amount', 'eff_stack',
      'hero_position', 'hero_cards', 'hero_stack', 'pot', 'hero_net', 'hero_net_bb',
      'flop', 'turn', 'river', 'action_i', 'street', 'player', 'player_id', 'position', 'action',
      'amount', 'note'];
    var rows = [cols.join(',')];
    var src = list ? { sessions: list.map(oneSessionRecord) } : bundle();
    src.sessions.forEach(function (s) {
      s.hands.forEach(function (hd) {
        var base = [s.id, s.venue, s.date, s.currency, s.sb, s.bb, hd.id, hd.no, hd.tableSize,
          hd.straddle ? hd.straddle.position : '', hd.straddle ? hd.straddle.amount : '',
          hd.effStack == null ? '' : hd.effStack,
          hd.heroPosition, hd.heroCards.join(' '), hd.heroStack, hd.pot, hd.heroNet, hd.heroNetBB,
          hd.board.flop.join(' '), hd.board.turn.join(' '), hd.board.river.join(' ')];
        if (!hd.actions.length) rows.push(csv(base.concat(['', '', '', '', '', '', '', hd.note])));
        hd.actions.forEach(function (a) {
          rows.push(csv(base.concat([a.i, a.street, a.player, a.playerId || '', a.position,
            a.action, a.to == null ? '' : a.to, hd.note])));
        });
      });
    });
    return rows.join('\n');
  }
  function exportCSV() {
    downloadBlob(new Blob([csvFor(null)], { type: 'text/csv' }),
      'hand-recall-' + todayISO() + '.csv');
    toast('Exported.', 'ok');
  }
  function csv(vals) {
    return vals.map(function (v) {
      v = v == null ? '' : String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',');
  }

  function importJSON() {
    var file = h('input', { type: 'file', accept: 'application/json', style: 'display:none' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          if (restoreFrom(JSON.parse(fr.result))) {
            toast('Imported.', 'ok'); replace('sessions');
          } else {
            toast('That file does not hold a Hand recall backup.', 'warn', 4000);
          }
        } catch (e) { toast('Could not read that file.', 'warn'); }
      };
      fr.readAsText(f);
    });
    document.body.appendChild(file); file.click();
    setTimeout(function () { file.remove(); }, 1000);
  }

  /* ---------------------------------------------------------------- boot */

  /* one global outside-click handler for the settings panel — registering it
     per render would leak a listener on every screen change */
  document.addEventListener('click', function () {
    var m = document.querySelector('.menu:not([hidden])');
    if (!m) return;
    m.hidden = true;
    var b = m.parentNode && m.parentNode.querySelector('.icon-btn');
    if (b) b.setAttribute('aria-expanded', 'false');
  });

  load();
  window.HRAPP = {
    render: render, state: function () { return db; }, go: go, save: save,
    bundleForTest: bundle, backupForTest: backupPayload, restoreForTest: restoreFrom,
    sessionTextForTest: function (i) { return sessionText(realSessions()[i || 0]); },
    sessionBundleForTest: function (i) { return sessionBundle(realSessions()[i || 0]); },
    setRandomForTest: function (fn) { rnd = fn || Math.random; }
  };
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();
})();

</script>
</body>
</html>
