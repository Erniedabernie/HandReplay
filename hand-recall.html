  }

  function signature(ctx, C, cv, P) {
    monogram(ctx, C, P, cv.height - 46, 24, 0.72);
    right(ctx, C, cv.width - P, cv.height - 28, 'Hand recall', '20px ' + UI, C.muted);
  }

  function resultBox(ctx, C, r, x, y, w) {
    ctx.save();
    rr(ctx, x, y, w, 96, 6);
    ctx.fillStyle = C.surface; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    var lead = r.chop ? 'Chop ' + HR.fmtNum(r.snap.pot)
      : r.winner ? r.winner.name + ' wins ' + HR.fmtNum(r.winner.amount)
        : 'Result';
    label(ctx, C, x + 26, y + 58, lead, C.muted, 26);
    if (r.heroNetLine) {
      var net = (r.heroName || 'Hero') + ' ' +
        (r.heroNet > 0 ? '+' : r.heroNet < 0 ? '−' : '') + HR.fmtNum(Math.abs(r.heroNet));
      right(ctx, C, x + w - 26, y + 62, net, '500 38px ' + MONO,
        r.heroNet > 0 ? C.up : r.heroNet < 0 ? C.down : C.text);
    }
    return 96;
  }

  /* --------------------------------------------------------- layout: card
     Board across the top, then the action with no card thumbnails, then the
     hands that were shown, then the result. */

  function header(ctx, C, r, P) {
    ctx.save();
    ctx.font = '600 52px ' + SERIF; ctx.fillStyle = C.text;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(r.head.split(' · ')[0], P, 96);          /* the date, large */
    ctx.restore();
    var rest = r.head.split(' · ').slice(1);
    label(ctx, C, P, 132, rest.slice().reverse().join('  ·  '), C.muted, 26);
    /* straddle and effective stack get their own line, and only when set */
    if (r.head2) label(ctx, C, P, 166, r.head2.split(' · ').join('  ·  '), C.muted, 24);
  }

  function boardRow(ctx, C, r, P, y) {
    var list = r.boardFull;
    if (!list.length) return 0;
    var bw = 96, bh = 132, gap = 12, groupGap = 26;
    /* flop | turn | river, so the runout reads in streets */
    var groups = [list.slice(0, 3), list.slice(3, 4), list.slice(4, 5)]
      .filter(function (g) { return g.length; });
    var total = groups.reduce(function (t, g) {
      return t + g.length * (bw + gap) - gap + groupGap;
    }, -groupGap);
    var x = (W - total) / 2;
    groups.forEach(function (g) {
      cards(ctx, C, x, y, bw, bh, g, gap);
      x += g.length * (bw + gap) - gap + groupGap;
    });
    return bh;
  }

  function handsBlock(ctx, C, r, P, y) {
    if (!r.hands.length) return 0;
    var rowH = 78, cw = 52, ch = 72, gap = 8;
    r.hands.forEach(function (hand, i) {
      var top = y + i * rowH;
      label(ctx, C, P, top + 46, hand.name, C.text, 28);
      var list = hand.cards || [HR.UNKNOWN, HR.UNKNOWN];
      var tw = list.length * (cw + gap) - gap;
      cards(ctx, C, W - P - tw, top + 4, cw, ch, list, gap);
      if (i < r.hands.length - 1) hairline(ctx, C, P, W - P, top + rowH - 3, 1);
    });
    return r.hands.length * rowH;
  }

  function renderCard(hd) {
    var C = tokens();
    var r = HR.toRows(hd);
    var P = 64;
    var innerW = W - P * 2;
    var textX = P + 96;
    var textW = innerW - 96 - 130;          // leaves room for the pot column

    /* measure first so the canvas ends exactly where the content does */
    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '27px ' + UI;
    var lineSets = r.rows.map(function (row) {
      return row.text ? wrap(probe, row.text, textW) : [];
    });
    var rowH = lineSets.map(function (ls) { return Math.max(50, 22 + ls.length * 34); });

    var headTop = 176 + (r.head2 ? 40 : 0);             // second line when set
    var height = headTop;                               // title block
    if (r.boardFull.length) height += 24 + 132 + 26;    // board row
    height += 8;
    rowH.forEach(function (x) { height += x; });
    if (r.hands.length) height += 26 + r.hands.length * 78;
    height += 18 + 96;                                  // result card
    height += 76;                                       // signature band

    var cv = document.createElement('canvas');
    cv.width = W; cv.height = Math.round(height);
    var ctx = cv.getContext('2d');
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, cv.height);

    header(ctx, C, r, P);
    var y = headTop;
    if (r.boardFull.length) {
      y += 24;
      y += boardRow(ctx, C, r, P, y) + 26;
    }
    hairline(ctx, C, P, W - P, y - 8, 2);
    y += 8;

    /* the action — no board thumbnails, the board is up top */
    r.rows.forEach(function (row, i) {
      streetTag(ctx, C, P, y + 30, row.tag);
      right(ctx, C, W - P, y + 30, HR.fmtNum(row.pot), '22px ' + MONO, C.muted);
      lineSets[i].forEach(function (ln, k) {
        label(ctx, C, textX, y + 30 + k * 34, ln, C.text, 27);
      });
      y += rowH[i];
      if (i < r.rows.length - 1) hairline(ctx, C, P, W - P, y - 12, 1);
    });

    if (r.hands.length) {
      hairline(ctx, C, P, W - P, y + 12, 2);
      y += 26;
      y += handsBlock(ctx, C, r, P, y);
    }

    y += 18;
    y += resultBox(ctx, C, r, P, y, innerW);
    signature(ctx, C, cv, P);
    return cv;
  }

  /* -------------------------------------------------------- layout: table */

  function renderTable(hd) {
    var C = tokens();
    var r = HR.toRows(hd);
    var snap = r.snap;
    var P = 64;
    var headerH = 176 + (r.head2 ? 40 : 0);
    var tableH = 1000;
    var textX = P + 96;
    var textW = W - P * 2 - 96 - 130;

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '24px ' + UI;
    var lineSets = r.rows.map(function (row) {
      return row.text ? wrap(probe, row.text, textW) : [];
    });
    var rowH = lineSets.map(function (ls) { return Math.max(48, 24 + ls.length * 32); });

    var cv = document.createElement('canvas');
    cv.width = W;
    cv.height = headerH + tableH + 26 + rowH.reduce(function (a, b) { return a + b; }, 0) +
      24 + 96 + 76;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, cv.height);

    header(ctx, C, r, P);

    /* felt */
    var cx = W / 2, cy = headerH + tableH / 2;
    /* vertical oval, matching the app; rx is capped by the plaque either side */
    var rx = 250, ry = 400;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.high; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    /* board across the middle, flop | turn | river, pot below it */
    var groups = [hd.boards[1] || [], hd.boards[2] || [], hd.boards[3] || []]
      .filter(function (g) { return g.length; });
    var bw = 62, bh = 86, gap = 8, groupGap = 20;
    if (groups.length) {
      var total = groups.reduce(function (t, g) {
        return t + g.length * (bw + gap) - gap + groupGap;
      }, -groupGap);
      var x = cx - total / 2;
      groups.forEach(function (g) {
        cards(ctx, C, x, cy - bh - 10, bw, bh, g, gap);
        x += g.length * (bw + gap) - gap + groupGap;
      });
    }
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '22px ' + UI; ctx.fillStyle = C.muted;
    ctx.fillText('POT', cx, cy + (groups.length ? 34 : -6));
    ctx.font = '500 44px ' + MONO; ctx.fillStyle = C.text;
    ctx.fillText(HR.fmtNum(snap.pot), cx, cy + (groups.length ? 84 : 44));
    ctx.restore();

    /* the dealer's station, top middle — same layout as the app's table */
    (function () {
      var dw = 150, dh = 44;
      var dx = cx - dw / 2, dy = cy - ry - dh / 2;
      ctx.save();
      rr(ctx, dx, dy, dw, dh, 6);
      ctx.fillStyle = C.surface; ctx.fill();
      ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = '18px ' + UI; ctx.fillStyle = C.muted;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('DEALER', cx, dy + 29);
      ctx.restore();
    })();

    /* seats — same anchors as the app's table, so the picture matches */
    var anchors = HR.seatAnchors(cx, cy, rx + 172, ry + 64,
      hd.players || snap.order.length);
    var sbw = 190, sbh = 96;
    snap.order.forEach(function (seatIdx) {
      var p = snap.seatMap[seatIdx];
      var pos = anchors[seatIdx] || { x: cx, y: cy + ry + 78 };
      var sx = pos.x, sy = pos.y;
      var folded = !!snap.folded[seatIdx];

      ctx.save();
      ctx.globalAlpha = folded ? 0.42 : 1;
      rr(ctx, sx - sbw / 2, sy - sbh / 2, sbw, sbh, 6);
      ctx.fillStyle = p.hero ? C.accentDim : C.high; ctx.fill();
      ctx.strokeStyle = p.hero ? C.accent : C.border; ctx.lineWidth = 2; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '500 26px ' + UI; ctx.fillStyle = C.text;
      /* the same rule as everywhere else: a seat with no name wears its
         position — never a dash, and never the position printed twice */
      var plaque = HR.seatName(seatIdx, snap);
      ctx.fillText(clip(ctx, plaque, sbw - 48), sx, sy - 10);
      ctx.font = '20px ' + MONO; ctx.fillStyle = C.muted;
      var behind = p.stack == null ? null : p.stack - (snap.contrib[seatIdx] || 0);
      var sub = plaque === snap.positions[seatIdx] ? '' : snap.positions[seatIdx];
      if (snap.allin[seatIdx]) sub += (sub ? '  ' : '') + 'all-in';
      else if (behind != null) sub += (sub ? '  ' : '') + HR.fmtNum(behind);
      if (sub) ctx.fillText(sub, sx, sy + 22);
      ctx.restore();

      /* hole cards on the felt side of the box; a live player who never showed
         gets question marks so you can see who got to the end */
      var hole = (hd.hole || {})[seatIdx] || [];
      var live = snap.live.indexOf(seatIdx) >= 0;
      if (hole.length || live) {
        var hw = 42, hh2 = 58;
        var tw = (hole.length || 2) * (hw + 6) - 6;
        var hx = sx - tw / 2;
        var hy = sy > cy ? sy - sbh / 2 - hh2 - 10 : sy + sbh / 2 + 10;
        ctx.save();
        ctx.globalAlpha = folded ? 0.42 : 1;
        if (hole.length) cards(ctx, C, hx, hy, hw, hh2, hole, 6);
        else unknownCards(ctx, C, hx, hy, hw, hh2, 6);
        ctx.restore();
      }

      /* dealer badge inside the box — never collides with the cards */
      if (seatIdx === hd.buttonSeat) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx + sbw / 2 - 20, sy - sbh / 2 + 20, 17, 0, Math.PI * 2);
        ctx.fillStyle = C.text; ctx.fill();
        ctx.font = '500 19px ' + MONO; ctx.fillStyle = C.bg;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('D', sx + sbw / 2 - 20, sy - sbh / 2 + 21);
        ctx.restore();
      }
    });

    /* street list */
    var y = headerH + tableH + 20;
    r.rows.forEach(function (row, i) {
      streetTag(ctx, C, P, y + 24, row.tag);
      right(ctx, C, W - P, y + 24, HR.fmtNum(row.pot), '22px ' + MONO, C.muted);
      lineSets[i].forEach(function (ln, k) {
        label(ctx, C, textX, y + 24 + k * 32, ln, C.text, 24);
      });
      y += rowH[i];
      hairline(ctx, C, P, W - P, y - 14, 1);
    });

    y += 24;
    resultBox(ctx, C, r, P, y, W - P * 2);
    signature(ctx, C, cv, P);
    return cv;
  }

  window.renderHandImage = function (hd, style) {
    try {
      return style === 'table' ? renderTable(hd) : renderCard(hd);
    } catch (e) {
      var cv = document.createElement('canvas');
      cv.width = 720; cv.height = 200;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#050a0e'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#eaf4ff'; ctx.font = '22px sans-serif';
      ctx.fillText('Could not draw this hand.', 40, 100);
      return cv;
    }
  };
})();

</script>
<script>
/* ============================================================
   Hand recall — UI
   Phone-first, one-handed. Every mutation persists immediately so a
   hand survives the app being backgrounded mid-street.
   ============================================================ */
(function () {
  'use strict';

  var HR = window.HR;
  var APP_VERSION = '1.14.0';
  var KEY = 'edb-hand-recall-v1';
  var SEATS_MAX = 10;
  var SUIT_NAMES = { s: 'spades', h: 'hearts', d: 'diamonds', c: 'clubs' };
  /* picker layout: three rows of equal-width keys, and suits left to right.
     "?" is offered for hole cards only — a board card is face up by definition. */
  var RANK_ROWS = [['A', 'K', 'Q', 'J', 'T'], ['9', '8', '7', '6', '5'], ['4', '3', '2']];
  var SUIT_ORDER = 'dchs';

  /* ------------------------------------------------------------ storage */

  var db = {
    v: 1,
    roster: [],
    sessions: [],
    settings: {
      imageStyle: 'card', shareNote: false,
      /* stakes-adjacent things that never change hand to hand live here, not on
         the new-session form: HK$ and no ante is the default game */
      currency: 'HK$', anteOn: false, ante: 0
    }
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.v) {
        db = parsed;
        db.roster = db.roster || [];
        db.sessions = db.sessions || [];
        db.settings = db.settings || { imageStyle: 'card', shareNote: false };
        if (!db.settings.currency) db.settings.currency = 'HK$';
        if (db.settings.anteOn == null) db.settings.anteOn = false;
        if (db.settings.ante == null) db.settings.ante = 0;
      }
    } catch (e) { /* first run, private mode, or corrupt — start clean */ }
  }
  var saveWarned = false;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) {
      if (!saveWarned) {
        saveWarned = true;
        toast('Cannot save to this device — the hand stays only until you close the app.', 'warn', 6000);
      }
    }
  }

  /* screenshots live in IndexedDB — they would blow the localStorage quota */
  var IMG = (function () {
    var dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise(function (res, rej) {
        if (!window.indexedDB) return rej(new Error('no indexeddb'));
        var r = indexedDB.open('edb-hand-recall-img', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('img'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
      return dbp;
    }
    function tx(mode, fn) {
      return open().then(function (d) {
        return new Promise(function (res, rej) {
          var t = d.transaction('img', mode);
          var req = fn(t.objectStore('img'));
          t.oncomplete = function () { res(req && req.result); };
          t.onerror = function () { rej(t.error); };
        });
      });
    }
    return {
      put: function (k, v) { return tx('readwrite', function (s) { return s.put(v, k); }); },
      get: function (k) { return tx('readonly', function (s) { return s.get(k); }); },
      del: function (k) { return tx('readwrite', function (s) { return s.delete(k); }); }
    };
  })();

  /* --------------------------------------------------------------- util */

  function uid(p) {
    return (p || 'x') + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function isoToDMY(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }
  function dmyToISO(d) {
    if (!d) return '';
    var p = d.split('/');
    return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : d;
  }
  var num = HR.fmtNum;

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'on') Object.keys(v).forEach(function (ev) { e.addEventListener(ev, v[ev]); });
      else if (k === 'style') e.setAttribute('style', v);
      else if (k === 'data') Object.keys(v).forEach(function (d) { e.dataset[d] = v[d]; });
      else if (k === 'disabled') e.disabled = !!v;
      else e.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function icon(name, size) {
    var s = size || 20;
    return h('span', {
      class: 'ic', 'aria-hidden': 'true', data: { icon: name },
      html: '<svg width="' + s + '" height="' + s + '" viewBox="0 0 256 256" fill="currentColor">' +
        (window.ICONS[name] || '') + '</svg>'
    });
  }
  function cardEl(card, cls) {
    if (!card) return h('span', { class: 'crd slot ' + (cls || ''), text: '·' });
    if (card === HR.UNKNOWN) {
      return h('span', {
        class: 'crd unk ' + (cls || ''), text: '?', 'aria-label': 'card not shown'
      });
    }
    return h('span', {
      class: 'crd ' + card[1] + ' ' + (cls || ''),
      text: card[0] + HR.SUIT_GLYPH[card[1]],
      'aria-label': card[0] + ' of ' + SUIT_NAMES[card[1]]
    });
  }
  function cardsEl(list, cls) {
    return h('span', { class: 'cardrow' }, (list || []).map(function (c) { return cardEl(c, cls); }));
  }
  /* a hand that was never shown: two question marks, not blank slots */
  function unknownEl(cls) {
    return h('span', { class: 'cardrow' }, [
      h('span', { class: 'crd unk ' + (cls || ''), text: '?', 'aria-label': 'hand not shown' }),
      h('span', { class: 'crd unk ' + (cls || ''), text: '?', 'aria-hidden': 'true' })
    ]);
  }

  var toastTimer = null;
  function toast(msg, kind, ms) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = h('div', { class: 'toast ' + (kind || ''), role: 'status', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) t.remove(); }, ms || 2600);
  }

  /* ------------------------------------------------------------- sheets */

  var sheetEls = [];
  function closeSheet() {
    sheetEls.forEach(function (e) { if (e.parentNode) e.remove(); });
    sheetEls = [];
    document.removeEventListener('keydown', sheetKey);
  }
  function sheetKey(ev) { if (ev.key === 'Escape') closeSheet(); }
  function openSheet(title, sub, body, actions) {
    closeSheet();
    var scrim = h('div', { class: 'scrim', on: { click: closeSheet } });
    var inner = h('div', { class: 'inner' }, [
      h('h3', { text: title }),
      sub ? h('p', { class: 'sub', text: sub }) : null,
      body,
      actions ? h('div', { class: 'actionsrow' }, actions) : null
    ]);
    var sheet = h('div', {
      class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title
    }, [
      h('button', {
        class: 'icon-btn close', 'aria-label': 'Close',
        on: { click: closeSheet }
      }, [icon('x', 18)]),
      inner
    ]);
    document.body.appendChild(scrim);
    document.body.appendChild(sheet);
    sheetEls = [scrim, sheet];
    document.addEventListener('keydown', sheetKey);
    return sheet;
  }
  function confirmSheet(title, body, okLabel, onOk) {
    openSheet(title, body, h('div'), [
      h('button', { class: 'btn btn-ghost', text: 'Cancel', on: { click: closeSheet } }),
      h('button', {
        class: 'btn btn-primary', text: okLabel,
        on: { click: function () { closeSheet(); onOk(); } }
      })
    ]);
  }

  /* --------------------------------------------------------- card picker
     Rank then suit — two big taps per card beats a 52-cell grid on a phone. */
  /* The card face on its own: slots, ranks, suits. Extracted so the pre-hand
     sheet can order it below other controls and hide it entirely, while the
     board and villain pickers keep the plain sheet around it. */
  function cardFace(opts) {
    /* opts: {count, used:[], initial:[], allowUnknown, autoFinish, onFull, onChange} */
    var count = opts.count;
    var chosen = new Array(count);
    (opts.initial || []).forEach(function (c, i) {
      if (i < count && HR.cardEntry(c)) chosen[i] = c;
    });
    var rank = null;
    var active = nextEmpty();
    var slotsEl = h('div', { class: 'slots' });
    var ranksEl = h('div', { class: 'ranks' });
    var suitsEl = h('div', { class: 'suits' });
    var el = h('div', { class: 'cardface' }, [slotsEl, ranksEl, suitsEl]);

    function nextEmpty() {
      for (var i = 0; i < count; i++) if (!chosen[i]) return i;
      return null;                       /* full — tap a slot to change one */
    }
    function filled() {
      for (var i = 0; i < count; i++) if (!chosen[i]) return false;
      return true;
    }
    /* a card is unavailable if it is used elsewhere in the hand, or already
       sitting in one of the other slots here */
    function taken(c) {
      if (c === HR.UNKNOWN) return false;          /* repeatable, never blocked */
      if ((opts.used || []).indexOf(c) >= 0) return true;
      for (var i = 0; i < count; i++) {
        if (i !== active && chosen[i] === c) return true;
      }
      return false;
    }
    function place(card) {
      if (active == null) return;
      chosen[active] = card;
      rank = null;
      active = nextEmpty();
      draw();
      if (opts.onChange) opts.onChange();
      if (filled() && opts.autoFinish !== false && opts.onFull) opts.onFull(chosen.slice());
    }

    function draw() {
      slotsEl.innerHTML = '';
      for (var i = 0; i < count; i++) {
        (function (i) {
          slotsEl.appendChild(h('button', {
            class: 'slot' + (active === i ? ' aim' : ''),
            'aria-label': chosen[i]
              ? 'Card ' + (i + 1) + ', ' + HR.cardGlyph(chosen[i]) + '. Change it'
              : 'Card ' + (i + 1) + ', empty',
            on: {
              click: function () {
                chosen[i] = undefined;
                active = i;
                rank = null;
                draw();
                if (opts.onChange) opts.onChange();
              }
            }
          }, [cardEl(chosen[i], 'lg')]));
        })(i);
      }
      if (chosen.some(Boolean)) {
        slotsEl.appendChild(h('button', {
          class: 'chipbtn', text: 'Clear',
          on: {
            click: function () {
              chosen = new Array(count);
              rank = null; active = 0; draw();
              if (opts.onChange) opts.onChange();
            }
          }
        }));
      }

      ranksEl.innerHTML = '';
      RANK_ROWS.forEach(function (row, ri) {
        var keys = row.slice();
        /* the unknown key rides on the last row, hole cards only */
        if (ri === RANK_ROWS.length - 1 && opts.allowUnknown) keys.push(HR.UNKNOWN);
        keys.forEach(function (r) {
          if (r === HR.UNKNOWN) {
            ranksEl.appendChild(h('button', {
              class: 'pk unkkey', text: '?', 'aria-label': 'Card not shown',
              disabled: active == null,
              on: { click: function () { place(HR.UNKNOWN); } }
            }));
            return;
          }
          var all = HR.SUITS.split('').every(function (su) { return taken(r + su); });
          ranksEl.appendChild(h('button', {
            class: 'pk' + (rank === r ? ' on' : ''), text: r,
            disabled: all || active == null,
            on: { click: function () { rank = r; draw(); } }
          }));
        });
        /* pad the short rows so every key keeps the same width */
        for (var k = keys.length; k < 5; k++) ranksEl.appendChild(h('span', { class: 'pkgap' }));
      });

      suitsEl.innerHTML = '';
      SUIT_ORDER.split('').forEach(function (su) {
        var c = rank ? rank + su : null;
        suitsEl.appendChild(h('button', {
          class: 'pk su ' + su, text: HR.SUIT_GLYPH[su],
          'aria-label': rank ? (rank + ' of ' + SUIT_NAMES[su]) : SUIT_NAMES[su],
          disabled: !rank || active == null || taken(c),
          on: { click: function () { place(rank + su); } }
        }));
      });
    }
    draw();

    return {
      el: el,
      full: filled,
      cards: function () { return chosen.slice(); },
      hint: function () {
        return active == null
          ? 'Tap a card to change just that one.'
          : (opts.allowUnknown ? 'Rank, then suit. “?” for a card you did not see.'
            : 'Rank, then suit.');
      }
    };
  }

  /* --------------------------------------------------------- card picker
     Rank then suit — two big taps per card beats a 52-cell grid on a phone. */
  function pickCards(opts) {
    /* opts: {title, count, used:[], initial:[], allowUnknown, skip, onDone(cards)} */
    var face = cardFace({
      count: opts.count, used: opts.used, initial: opts.initial,
      allowUnknown: opts.allowUnknown,
      onChange: sync,
      onFull: function (cards) { closeSheet(); opts.onDone(cards); }
    });
    var sheet;
    function finish() {
      if (!face.full()) return;
      closeSheet();
      opts.onDone(face.cards());
    }
    function sync() {
      var ok = sheet && sheet.querySelector('[data-ok]');
      if (ok) ok.disabled = !face.full();
      var hint = sheet && sheet.querySelector('[data-hint]');
      if (hint) hint.textContent = face.hint();
    }
    sheet = openSheet(opts.title, ' ', face.el, [
      opts.skip ? h('button', {
        class: 'btn btn-ghost', text: opts.skip.label,
        on: { click: function () { closeSheet(); opts.skip.onSkip(); } }
      }) : null,
      h('button', {
        class: 'btn btn-primary', text: 'Done', data: { ok: '1' },
        on: { click: finish }
      })
    ].filter(Boolean));
    var sub = sheet.querySelector('.sub');
    if (sub) sub.setAttribute('data-hint', '1');
    sync();
  }

  /* ------------------------------------------------------------- keypad */
  function keypad(opts) {
    /* opts: {title, sub, value, currency, meta:[[label,value]], min, onDone(n)} */
    var val = opts.value != null ? String(opts.value) : '';
    var disp, hint;
    function draw() {
      disp.innerHTML = '';
      disp.appendChild(h('span', { class: 'cur', text: opts.currency || '' }));
      disp.appendChild(document.createTextNode(val === '' ? '0' : num(Number(val))));
      var ok = document.querySelector('[data-kok]');
      if (ok) ok.disabled = !(Number(val) > 0);
      if (hint) {
        var n = Number(val);
        hint.textContent = (opts.min && n > 0 && n < opts.min)
          ? 'Below the minimum raise of ' + num(opts.min) + ' — saved as entered.'
          : '';
      }
    }
    function tap(k) {
      if (k === 'del') val = val.slice(0, -1);
      else if (k === '00') val = val === '' ? '' : val + '00';
      else if (val.length < 9) val = (val === '0' ? '' : val) + k;
      draw();
    }
    disp = h('div', { class: 'kdisp', 'aria-live': 'polite' });
    hint = h('div', { class: 'kmeta' });
    var pad = h('div', { class: 'kpad' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0'].forEach(function (k) {
      pad.appendChild(h('button', { text: k, on: { click: function () { tap(k); } } }));
    });
    pad.appendChild(h('button', {
      'aria-label': 'Backspace', on: { click: function () { tap('del'); } }
    }, [icon('backspace', 22)]));

    var metaRow = h('div', { class: 'kmeta' }, (opts.meta || []).map(function (m) {
      return h('span', { text: m[0] + ' ' + m[1] });
    }));

    var body = h('div', {}, [disp, metaRow, hint, pad]);
    openSheet(opts.title, opts.sub, body, [
      h('button', {
        class: 'btn btn-primary', text: 'Confirm', data: { kok: '1' },
        on: {
          click: function () {
            var n = Number(val);
            if (!(n > 0)) return;
            closeSheet(); opts.onDone(n);
          }
        }
      })
    ]);
    draw();
  }

  /* ---------------------------------------------------------- app state */

  var route = { name: 'sessions' };
  var stack = [];
  function go(name, params) {
    stack.push(route);
    route = Object.assign({ name: name }, params || {});
    window.scrollTo(0, 0);
    render();
  }
  function back() {
    route = stack.length ? stack.pop() : { name: 'sessions' };
    window.scrollTo(0, 0);
    render();
  }
  function replace(name, params) {
    route = Object.assign({ name: name }, params || {});
    window.scrollTo(0, 0);
    render();
  }

  function session() {
    return db.sessions.filter(function (s) { return s.id === route.sessionId; })[0] || null;
  }
  function hand() {
    var s = session();
    if (!s) return null;
    return s.hands.filter(function (x) { return x.id === route.handId; })[0] || null;
  }
  /* hands snapshot the name they were recorded with, so a rename sweeps them */
  function renameInHands(playerId, nm) {
    db.sessions.forEach(function (ss) {
      ss.hands.forEach(function (hd) {
        (hd.seats || []).forEach(function (x) { if (x.playerId === playerId) x.name = nm; });
      });
    });
  }

  function rosterName(id) {
    var p = db.roster.filter(function (r) { return r.id === id; })[0];
    return p ? p.name : '';
  }
  function me() { return db.roster.filter(function (r) { return r.me; })[0] || null; }
  /* Ernest is shown by name everywhere, never as "You" or "Hero" */
  function heroName() {
    var m = me();
    return (m && m.name) || 'Me';
  }
  /* A seat with no name recorded wears its position — the same rule the engine
     uses for the shared text, so a plaque and the log never say different things.
     Pass the snapshot whenever there is one. */
  function seatLabel(p, snap) {
    if (!p) return '';
    if (p.name) return p.name;
    var pos = snap && snap.positions ? snap.positions[p.seat] : null;
    return pos || (p.hero ? heroName() : 'Seat');
  }

  /* seats on a session are the live table; a hand snapshots them on creation */
  function seatedList(s) {
    return (s.seats || []).slice().sort(function (a, b) { return a.seat - b.seat; });
  }

  /* ------------------------------------------------------- loose hands
     A hand you jot down that belongs to no session. It lives in a container
     flagged `loose`, kept in db.sessions so routing, export and the backup all
     work unmodified — it is just kept out of the session list and given its own
     row. Every hand already stores its own blinds, date, seats and button, so a
     loose hand is self-contained and can be moved into a session later. */
  function isLoose(s) { return !!(s && s.loose); }
  function realSessions() { return db.sessions.filter(function (s) { return !isLoose(s); }); }
  /* an empty loose pile is noise — it disappears once its last hand is filed or
     deleted, and comes back the next time one is added */
  function pruneLoose() {
    var box = db.sessions.filter(isLoose)[0];
    if (box && !box.hands.length) {
      db.sessions = db.sessions.filter(function (x) { return x.id !== box.id; });
    }
  }
  function looseBox(create) {
    var found = db.sessions.filter(isLoose)[0];
    if (found || !create) return found || null;
    var s = {
      id: uid('s'), ts: Date.now(), loose: true,
      venue: 'Loose hands', date: isoToDMY(todayISO()),
      currency: db.settings.currency || 'HK$', sb: quick().sb, bb: quick().bb, ante: 0,
      players: quick().players, seats: [], buttonSeat: 0, hands: []
    };
    /* pushed, not unshifted: it is not a session and must not sit at the top of
       anything that reads db.sessions[0] as "the most recent session" */
    db.sessions.push(s);
    return s;
  }
  /* the quick-hand defaults, remembered so the common case is one tap */
  function quick() {
    db.settings.quick = db.settings.quick ||
      { players: 6, sb: 5, bb: 10, heroPos: null };
    return db.settings.quick;
  }

  /* Find or create a roster player by name. Matching ignores case and spaces and
     the stored spelling wins, so one person keeps one id across sessions. */
  function playerFor(nm, isMe) {
    var key = nm.trim().toLowerCase();
    var found = db.roster.filter(function (r) {
      return (r.name || '').trim().toLowerCase() === key;
    })[0];
    var p = found || { id: uid('p'), name: nm.trim(), me: false };
    if (!found) db.roster.push(p);
    if (isMe) {
      db.roster.forEach(function (r) { r.me = false; });
      p.me = true;
    }
    return p;
  }

  /* ------------------------------------------------------------ session */

  function newSession(form) {
    var s = {
      id: uid('s'),
      ts: Date.now(),
      date: isoToDMY(form.date),
      venue: form.venue || 'Cash game',
      currency: form.currency,
      sb: form.sb, bb: form.bb, ante: form.ante || 0,
      players: form.players || 9,
      seats: [], buttonSeat: 0, hands: []
    };
    /* the draw: shuffle everyone into the seats that exist, then put the button
       on one of them. A home game draws for seats and this is that draw — it
       also means no seat-by-seat setup and no "mark your own seat" step. */
    var names = (form.roll || []).slice();
    if (names.length) {
      var anchors = [];
      for (var i = 0; i < s.players; i++) anchors.push(i);
      shuffle(anchors);
      var m = me();
      names.forEach(function (nm, k) {
        /* only his own chip can create the hero — never "whoever went in first" */
        var isHim = !m && nm.trim().toLowerCase() === String(form.heroSeed || '').toLowerCase();
        var p = playerFor(nm, isHim);
        s.seats.push({ seat: anchors[k], playerId: p.id, stack: null });
      });
      s.buttonSeat = pick(anchors.slice(0, names.length));
    }
    db.sessions.unshift(s);
    save();
    replace('session', { sessionId: s.id });
  }

  /* A late joiner takes a free seat at random, the same way the opening draw
     works. If the table is already full the seat count grows to fit them, which
     is what actually happens when a chair is pulled up. */
  function joinSheet(s) {
    var nameInput = h('input', {
      class: 'input', placeholder: 'Name', 'aria-label': 'Name of the player joining'
    });
    var stackInput = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0',
      placeholder: 'optional', 'aria-label': 'Stack'
    });
    var body = h('div', {}, [
      h('div', { class: 'field' }, [h('label', { text: 'Name' }), nameInput]),
      h('div', { class: 'field', style: 'margin-top:12px' }, [
        h('label', { text: 'Stack — leave blank if you are not tracking it' }), stackInput
      ])
    ]);
    openSheet('Someone joined', 'They are drawn a free seat.', body, [
      h('button', {
        class: 'btn btn-primary', text: 'Seat them',
        on: {
          click: function () {
            var nm = nameInput.value.trim();
            if (!nm) { nameInput.focus(); return; }
            var taken = (s.seats || []).filter(function (x) {
              return (rosterName(x.playerId) || '').trim().toLowerCase() === nm.toLowerCase();
            })[0];
            if (taken) { toast(rosterName(taken.playerId) + ' is already at the table.', 'warn'); return; }
            var used = {};
            (s.seats || []).forEach(function (x) { used[x.seat] = true; });
            var free = [];
            for (var i = 0; i < s.players; i++) if (!used[i]) free.push(i);
            if (!free.length) {
              if (s.players >= SEATS_MAX) { toast('Ten is as big as the table gets.', 'warn'); return; }
              free = [s.players];
              s.players += 1;
            }
            var seat = pick(free);
            var p = playerFor(nm, false);
            s.seats.push({
              seat: seat, playerId: p.id,
              stack: Number(stackInput.value) > 0 ? Number(stackInput.value) : null
            });
            save(); closeSheet(); render();
            toast(p.name + ' drew seat ' + (seat + 1) + '.', 'ok');
          }
        }
      })
    ]);
  }

  /* Positions at a session's table right now, derived from who is seated and
     where the button is. One implementation, so the ring, the edit list and the
     move sheet cannot disagree about who is on the button. */
  function positionsOf(s, seats) {
    var list = seats || seatedList(s);
    var order = HR.seatOrder(list.map(function (x) { return x.seat; }), s.buttonSeat);
    var names = HR.positionsFor(order.length);
    var out = {};
    order.forEach(function (seatIdx, i) { out[seatIdx] = names[i] || ''; });
    return out;
  }

  /* Move somebody to another chair, or swap two people over. People change
     seats in a home game — usually to get position on somebody — and until now
     the only way to record it was to start the session again.

     Two things this deliberately does not touch:

     · HANDS ALREADY RECORDED. Every hand snapshots its own seats when it is
       created (`hd.seats`), so tonight's swap cannot rewrite who sat where in a
       hand played an hour ago. That is what makes this safe to offer at all.
     · THE BUTTON. It is a seat, not a person — it stays put and passes round.
       Move into the button seat and you have the button, which is exactly what
       happens in the room. */
  function seatMoveSheet(s, fromSeat) {
    var from = (s.seats || []).filter(function (x) { return x.seat === fromSeat; })[0];
    if (!from) return;
    /* Mid-hand is the one case to refuse. A hand in progress reads its own
       snapshot, but the live stack writes still go to `session().seats` by seat
       index — swap now and an all-in amount lands on the wrong player. */
    var open = s.hands.filter(function (hd) { return !hd.complete; })[0];
    if (open) {
      toast('Finish hand ' + open.no + ' first — moving a seat mid-hand puts stacks on the wrong player.',
        'warn', 4500);
      return;
    }

    var who = rosterName(from.playerId) || ('Seat ' + (fromSeat + 1));
    var pos = positionsOf(s);
    var bySeat = {};
    (s.seats || []).forEach(function (x) { bySeat[x.seat] = x; });

    function move(toSeat) {
      var other = bySeat[toSeat];
      var otherName = other ? (rosterName(other.playerId) || 'seat ' + (fromSeat + 1)) : null;
      from.seat = toSeat;
      if (other) other.seat = fromSeat;
      save(); closeSheet(); render();
      toast(other ? who + ' and ' + otherName + ' swapped seats.'
        : who + ' moved to seat ' + (toSeat + 1) + '.', 'ok');
    }

    var list = h('div', { class: 'rowlist' });
    var n = s.players || SEATS_MAX;
    for (var i = 0; i < n; i++) {
      if (i !== fromSeat) list.appendChild(seatRow(i));
    }
    function seatRow(seatIdx) {
      var occ = bySeat[seatIdx];
      return h('button', {
        class: 'lrow', on: { click: function () { move(seatIdx); } }
      }, [
        h('span', { class: 'g' }, [
          h('span', {
            class: 'a',
            text: 'Seat ' + (seatIdx + 1) + (pos[seatIdx] ? ' · ' + pos[seatIdx] : '')
          }),
          h('span', {
            class: 'b',
            text: occ ? 'Swap with ' + (rosterName(occ.playerId) || 'the player here')
              : 'Move here — empty'
          })
        ]),
        icon('caret-right', 18)
      ]);
    }
    /* no action row: picking a seat is the action, and an empty row would just
       add a band of space under the list */
    openSheet('Move ' + who,
      'Seat ' + (fromSeat + 1) + (pos[fromSeat] ? ' · ' + pos[fromSeat] : '') + ' now.',
      list, null);
  }

  /* Fisher–Yates, in place. The draw has to be a real shuffle: sorting by
     Math.random() is biased and people notice when the same seat keeps coming up.
     The source of randomness is swappable so the tests can pin a layout. */
  var rnd = Math.random;
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  /* Derived, never a stored counter: discarding the newest hand frees its number
     again, while deleting one from the middle leaves the gap alone. */
  function nextHandNo(s) {
    return s.hands.reduce(function (t, hd) { return Math.max(t, hd.no || 0); }, 0) + 1;
  }

  /* The hands that actually contested the pot, for the history list: yours if
     you recorded them, then everyone still live at the end. A player who never
     showed comes back as null and renders as two question marks. */
  function contestedHands(hd, snap) {
    var out = [];
    var hero = (hd.hole || {})[snap.heroSeat] || [];
    if (hero.length === 2) out.push(hero);
    snap.live.forEach(function (seatIdx) {
      if (seatIdx === snap.heroSeat && hero.length === 2) return;
      var c = (hd.hole || {})[seatIdx] || [];
      out.push(c.length === 2 ? c : null);
    });
    return out;
  }

  function sessionNet(s) {
    return s.hands.reduce(function (t, hd) {
      if (!hd.complete) return t;
      var snap = HR.replay(hd);
      var res = HR.settle(hd, snap, hd.winners);
      return t + (snap.heroSeat == null ? 0 : res.net[snap.heroSeat]);
    }, 0);
  }

  /* --------------------------------------------------------------- hand */

  function startHand() {
    var s = session();
    var seats = seatedList(s);
    if (seats.length < 2) { toast('Seat at least two players first.'); return; }
    var heroSeat = null;
    seats.forEach(function (x) { if (x.playerId && me() && x.playerId === me().id) heroSeat = x.seat; });
    if (heroSeat == null) { toast('Mark your own seat — tap it and choose “This is me”.'); return; }
    var hd = {
      id: uid('h'), no: nextHandNo(s), ts: Date.now(), heroCardsNA: false,
      date: s.date, venue: s.venue, currency: s.currency,
      sb: s.sb, bb: s.bb, ante: s.ante || 0,
      /* both off every hand, by his call — a straddle is the exception, not the
         table's default, and a stale one silently rewrites the action order */
      straddle: null, effStack: null,
      buttonSeat: s.buttonSeat,
      players: s.players || SEATS_MAX,
      seats: seats.map(function (x) {
        return {
          seat: x.seat, playerId: x.playerId, name: rosterName(x.playerId),
          stack: x.stack == null ? null : x.stack,
          hero: !!(me() && x.playerId === me().id)
        };
      }),
      boards: [[], [], [], []],
      hole: {}, actions: [], winners: [],
      note: '', imageKey: null, complete: false
    };
    s.hands.unshift(hd);
    save();
    go('hand', { sessionId: s.id, handId: hd.id });
    /* hole cards first — everything else keys off them */
    setTimeout(function () { askHole(hd); }, 60);
  }

  /* Every real card already committed to this hand, minus the one thing being
     edited — otherwise re-opening a street finds its own cards greyed out and
     there is no way to change them. */
  function usedCards(hd, exceptSeat, exceptStreet) {
    var out = [];
    (hd.boards || []).forEach(function (b, st) {
      if (exceptStreet != null && st === exceptStreet) return;
      (b || []).forEach(function (c) { out.push(c); });
    });
    Object.keys(hd.hole || {}).forEach(function (k) {
      if (exceptSeat != null && String(exceptSeat) === k) return;
      (hd.hole[k] || []).forEach(function (c) { out.push(c); });
    });
    return out.filter(HR.cardValid);
  }

  /* ------------------------------------------------------ pre-hand sheet
     Everything known before the first decision, in the order he wants to answer
     it: how deep, then whether anyone straddled, then his cards. Go stays dark
     until all of it is in.

     The straddle rewrites who acts first, so it locks the moment an action is
     recorded, exactly like the dealer button. The effective stack is only an
     annotation, so it stays editable. */
  function askHole(hd) {
    var snap = HR.replay(hd);
    if (snap.heroSeat == null) return;
    var locked = (hd.actions || []).length > 0;
    var canStraddle = snap.n >= 3;
    var body = h('div', {});
    var sheet;

    /* ---- 1. effective stack, required ------------------------------- */
    var effConv = h('span', { class: 'pconv num' });
    var eff = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0',
      value: hd.effStack == null ? '' : hd.effStack,
      placeholder: 'chips', 'aria-label': 'Effective stack',
      on: {
        input: function () {
          var v = Number(this.value);
          hd.effStack = v > 0 ? v : null;
          effConv.textContent = hd.effStack > 0 ? HR.fmtBB(hd.effStack, hd.bb) : '';
          save(); ready();
        }
      }
    });
    effConv.textContent = hd.effStack > 0 ? HR.fmtBB(hd.effStack, hd.bb) : '';
    body.appendChild(h('div', { class: 'prow' }, [
      h('span', { class: 'plabel', text: 'Effective stack' }), eff, effConv
    ]));

    /* ---- 2. straddle ------------------------------------------------ */
    function setStrad(type) {
      if (!type) hd.straddle = null;
      else {
        hd.straddle = {
          type: type,
          amount: (hd.straddle && hd.straddle.amount) || (hd.bb * 2)
        };
      }
      save(); drawStrad(); render();
    }
    var stradSeg = h('div', { class: 'segmented', role: 'group', 'aria-label': 'Straddle' });
    var stradRow = h('div', { class: 'stradamt' });
    var stradHint = h('p', { class: 'phint' });

    function drawStrad() {
      var cur = (hd.straddle && hd.straddle.type) || '';
      stradSeg.innerHTML = '';
      [['', 'Off'], ['utg', 'UTG'], ['miss', 'BTN']].forEach(function (m) {
        stradSeg.appendChild(h('button', {
          class: cur === m[0] ? 'active' : '', text: m[1],
          disabled: locked || (!canStraddle && m[0] !== ''),
          'aria-label': m[0] === 'miss' ? 'Mississippi straddle from the button'
            : m[0] === 'utg' ? 'Straddle from under the gun' : 'No straddle',
          on: { click: function () { setStrad(m[0]); } }
        }));
      });

      stradRow.innerHTML = '';
      stradHint.textContent = '';
      if (!cur) {
        if (locked) stradHint.textContent = 'Action is already in — undo to change this.';
        else if (!canStraddle) stradHint.textContent = 'Three players or more to straddle.';
        return;
      }
      stradRow.appendChild(h('span', { class: 'plabel', text: 'Amount' }));
      stradRow.appendChild(h('input', {
        class: 'input num', type: 'number', inputmode: 'numeric', min: '0',
        value: hd.straddle.amount, 'aria-label': 'Straddle amount',
        disabled: locked,
        on: {
          input: function () {
            var v = Number(this.value);
            hd.straddle.amount = v > 0 ? v : hd.bb * 2;
            save(); drawStrad(); render();
          }
        }
      }));
      stradRow.appendChild(h('span', {
        class: 'pconv num', text: HR.fmtBB(hd.straddle.amount, hd.bb)
      }));
      /* Naming the seat is the check that matters: a Mississippi straddle putting
         the blinds in first is the bit that trips people up mid-hand. */
      var s2 = HR.replay(hd);
      var first = s2.next && s2.next.type === 'action' ? s2.next.seat : null;
      var nm = function (seat) {
        var x = seat == null ? null : s2.seatMap[seat];
        return x ? (seatLabel(x, s2) + ' (' + s2.positions[seat] + ')') : '—';
      };
      stradHint.textContent = nm(s2.straddle ? s2.straddle.seat : null) + ' posts ' +
        num(hd.straddle.amount) + ' · action starts with ' + nm(first) + '.';
      if (locked) stradHint.textContent += ' Locked — undo to change it.';
    }
    drawStrad();
    body.appendChild(h('div', { class: 'prow' }, [
      h('span', { class: 'plabel', text: 'Straddle' }), stradSeg
    ]));
    body.appendChild(stradRow);
    body.appendChild(stradHint);

    /* ---- 3. his hand, or a declaration that it does not matter ------- */
    body.appendChild(h('div', { class: 'hr' }));
    var na = !!hd.heroCardsNA;
    var faceBox = h('div', {});
    var face = cardFace({
      count: 2, allowUnknown: true, autoFinish: false,
      used: usedCards(hd, snap.heroSeat),
      initial: (hd.hole || {})[snap.heroSeat] || [],
      onChange: function () { ready(); }
    });
    faceBox.appendChild(face.el);

    var naSeg = h('div', { class: 'segmented', role: 'group', 'aria-label': 'Whose hand' });
    function drawNA() {
      naSeg.innerHTML = '';
      [[false, 'My cards'], [true, 'Irrelevant']].forEach(function (m) {
        naSeg.appendChild(h('button', {
          class: na === m[0] ? 'active' : '', text: m[1],
          on: { click: function () { na = m[0]; drawNA(); ready(); } }
        }));
      });
      /* nothing to fill in when the hand is not his — the keys would only be in
         the way, so they go rather than grey out */
      faceBox.hidden = na;
    }
    drawNA();
    body.appendChild(h('div', { class: 'prow' }, [
      h('span', { class: 'plabel', text: 'My hand' }), naSeg
    ]));
    body.appendChild(faceBox);
    var faceHint = h('p', { class: 'phint' });
    body.appendChild(faceHint);

    /* ---- go --------------------------------------------------------- */
    function ready() {
      faceHint.textContent = na
        ? 'Recorded as somebody else’s hand — no cards of yours go in.'
        : face.hint();
      var ok = sheet && sheet.querySelector('[data-ok]');
      if (ok) ok.disabled = !(hd.effStack > 0) || (!na && !face.full());
    }
    function go() {
      if (!(hd.effStack > 0)) { eff.focus(); return; }
      hd.hole = hd.hole || {};
      if (na) {
        delete hd.hole[snap.heroSeat];
        hd.heroCardsNA = true;
      } else {
        if (!face.full()) return;
        hd.hole[snap.heroSeat] = face.cards();
        hd.heroCardsNA = false;
      }
      save(); closeSheet(); render();
    }

    sheet = openSheet('Input your hand', 'Stack depth, any straddle, then your cards.',
      body, [
        h('button', {
          class: 'btn btn-primary wide', text: 'Go', data: { ok: '1' },
          on: { click: go }
        })
      ]);
    ready();
  }

  function askBoard(hd, street) {
    var names = ['', 'Flop', 'Turn', 'River'];
    pickCards({
      title: names[street],
      count: HR.BOARD_COUNT[street],
      used: usedCards(hd, null, street),
      initial: hd.boards[street] || [],
      onDone: function (cards) {
        hd.boards[street] = cards;
        save(); render();
      }
    });
  }

  function pushAction(hd, act) {
    hd.actions.push(act);
    save();
    afterAction(hd);
  }
  /* A loose hand names its cast up front, so anyone outside it folds the instant
     the action reaches them — he is never asked about a seat he already said was
     not in the hand. Blinds posted by an outsider stay in the pot as dead money,
     which is what really happens. Never acts for him. */
  function autoFoldOutsiders(hd) {
    if (!hd.involved || !hd.involved.length) return false;
    var pushed = false;
    for (var guard = 0; guard < 24; guard++) {
      var snap = HR.replay(hd);
      if (snap.next.type !== 'action') break;
      var seat = snap.next.seat;
      if (seat == null || seat === snap.heroSeat) break;
      if (hd.involved.indexOf(seat) >= 0) break;
      hd.actions.push({ street: snap.next.street, seat: seat, act: 'fold' });
      pushed = true;
      if (snap.live.length <= 2) break;              /* that fold ended the hand */
    }
    if (pushed) save();
    return pushed;
  }

  function afterAction(hd) {
    autoFoldOutsiders(hd);
    render();
    var snap = HR.replay(hd);
    if (snap.next.type === 'board' && (hd.boards[snap.next.street] || []).length === 0) {
      setTimeout(function () { askBoard(hd, snap.next.street); }, 80);
    }
  }
  function undo(hd) {
    if (!hd.actions.length) {
      /* nothing to undo on this street — walk back the board instead */
      for (var st = 3; st >= 1; st--) {
        if ((hd.boards[st] || []).length) { hd.boards[st] = []; save(); render(); return; }
      }
      return;
    }
    /* if the last street's board is in but has no actions yet, drop the board */
    var snap = HR.replay(hd);
    var last = snap.streets[snap.streets.length - 1];
    if (last && last.street > 0 && !last.actions.length && (hd.boards[last.street] || []).length) {
      hd.boards[last.street] = [];
    } else {
      hd.actions.pop();
      hd.winners = [];
      hd.complete = false;
    }
    save(); render();
  }

  /* Which seats can be handed the action right now? Everyone still live between
     the current actor and Ernest inclusive — walking past Ernest would mean
     acting for him, which the app never does. */
  function skipTargets(snap) {
    var out = {};
    if (!snap.next || snap.next.type !== 'action') return out;
    var from = snap.order.indexOf(snap.next.seat);
    for (var i = 1; i < snap.order.length; i++) {
      var t = snap.order[(from + i) % snap.order.length];
      if (snap.folded[t] || snap.allin[t]) continue;
      out[t] = true;
      if (t === snap.heroSeat) break;
    }
    return out;
  }

  /* Hand the action to a seat. Everyone stepped over is recorded as a check when
     there is nothing to call, and a fold when there is. Pass null to fold every
     remaining opponent — the "I took it down" case. */
  function skipTo(hd, targetSeat) {
    var guard = 0, pushed = 0;
    while (guard++ < 24) {
      var snap = HR.replay(hd);
      if (snap.next.type !== 'action') break;
      var seat = snap.next.seat;
      if (seat === targetSeat) break;
      if (seat === snap.heroSeat) break;
      var lg = HR.legalFor(hd, snap, seat);
      if (targetSeat == null && lg.toCall === 0) break;   /* nothing to fold to */
      hd.actions.push({
        street: snap.next.street, seat: seat,
        act: lg.toCall === 0 ? 'check' : 'fold'
      });
      pushed++;
      if (snap.live.length <= 2) break;                   /* that fold ended it */
    }
    if (!pushed) { toast('Already their turn.'); return; }
    save();
    afterAction(hd);
  }

  function askShowdown(hd) {
    var snap = HR.replay(hd);
    var sel = (hd.winners || []).slice();
    var body = h('div', {});
    var listEl = h('div', { class: 'rowlist' });
    body.appendChild(listEl);

    function draw() {
      listEl.innerHTML = '';
      snap.live.forEach(function (seatIdx) {
        var s = snap.seatMap[seatIdx];
        var cards = (hd.hole || {})[seatIdx] || [];
        var on = sel.indexOf(seatIdx) >= 0;
        var row = h('div', { class: 'lrow' }, [
          h('span', { class: 'g' }, [
            h('span', { class: 'a', text: seatLabel(s, snap) + '  ' }),
            h('span', { class: 'b', text: snap.positions[seatIdx] + ' · invested ' + num(snap.contrib[seatIdx]) })
          ]),
          h('button', {
            class: 'chipbtn', 'aria-label': 'Set cards for ' + seatLabel(s, snap),
            on: {
              click: function () {
                pickCards({
                  title: (s.hero ? 'Your cards' : seatLabel(s, snap) + '’s cards'),
                  count: 2, allowUnknown: true,
                  used: usedCards(hd, seatIdx), initial: cards,
                  onDone: function (c) {
                    hd.hole = hd.hole || {}; hd.hole[seatIdx] = c; save();
                    closeSheet(); askShowdown(hd);
                  }
                });
              }
            }
          }, cards.length ? [cardsEl(cards, 'sm')] : ['Cards']),
          h('button', {
            class: 'chipbtn' + (on ? ' on' : ''), text: on ? 'Winner' : 'Won?',
            on: {
              click: function () {
                var i = sel.indexOf(seatIdx);
                if (i >= 0) sel.splice(i, 1); else sel.push(seatIdx);
                draw();
              }
            }
          })
        ]);
        listEl.appendChild(row);
      });
    }
    draw();
    openSheet('Showdown', 'Tap the winner. Two winners chop.', body, [
      h('button', {
        class: 'btn btn-primary', text: 'Save hand',
        on: {
          click: function () {
            if (!sel.length) { toast('Pick who won the pot.'); return; }
            hd.winners = sel.slice();
            hd.complete = true;
            save(); closeSheet();
            applyResultToStacks(hd);
            replace('result', { sessionId: route.sessionId, handId: hd.id });
            offerNames(hd);
          }
        }
      })
    ]);
  }

  function finishByFolds(hd) {
    var snap = HR.replay(hd);
    hd.winners = snap.live.slice();
    hd.complete = true;
    save();
    applyResultToStacks(hd);
    replace('result', { sessionId: route.sessionId, handId: hd.id });
    offerNames(hd);
  }

  /* carry stacks forward: the next hand starts where this one ended */
  function applyResultToStacks(hd) {
    var s = session();
    if (!s) return;
    var snap = HR.replay(hd);
    var res = HR.settle(hd, snap, hd.winners);
    s.seats.forEach(function (seat) {
      var st = hd.seats.filter(function (x) { return x.seat === seat.seat; })[0];
      if (!st || st.stack == null || seat.stack == null) return;
      seat.stack = Math.max(0, seat.stack + (res.net[seat.seat] || 0));
    });
    /* move the button one occupied seat clockwise */
    var order = HR.seatOrder(seatedList(s).map(function (x) { return x.seat; }), s.buttonSeat);
    if (order.length > 1) s.buttonSeat = order[0];
    save();
  }

  /* ------------------------------------------------------------ ring UI */

  /* Seat anchors come from the engine so the app and the picture agree. The
     oval is vertical: a phone is tall, so the long axis should be too. */
  function anchorsFor(n) { return HR.seatAnchors(50, 50, 41, 42, n); }
  function betPos(anchors, i) {
    var p = anchors[i];
    return { x: 50 + (p.x - 50) * 0.46, y: 50 + (p.y - 50) * 0.55 };
  }
  /* the button sits against the player, on the felt side of their seat */
  /* The button sits beside the plaque, on the side facing the middle of the
     table — a percentage step would land on top of the name, so the offset is
     in pixels off the seat anchor. */
  function dealerPos(anchors, i) {
    var p = anchors[i] || { x: 50, y: 90 };
    var dx = (p.x < 50 ? 42 : -42);
    var dy = (p.y < 50 ? 12 : -12);
    return {
      left: 'calc(' + p.x + '% + ' + dx + 'px)',
      top: 'calc(' + p.y + '% + ' + dy + 'px)'
    };
  }

  function ringEl(cfg) {
    /* cfg: {seats, buttonSeat, snap, hole, onSeat, editable, centre, targets} */
    var box = h('div', { class: 'ringbox' });
    var felt = h('div', { class: 'felt' }, [cfg.centre || null]);
    box.appendChild(felt);

    /* the dealer's station at the top middle — fixes which way the table faces */
    box.appendChild(h('div', { class: 'dealerst', 'aria-hidden': 'true' }, [
      h('span', { class: 'tag', text: 'Dealer' })
    ]));

    var bySeat = {};
    cfg.seats.forEach(function (x) { bySeat[x.seat] = x; });
    var targets = cfg.targets || {};
    var n = cfg.players || SEATS_MAX;
    var anchors = anchorsFor(n);

    for (var i = 0; i < n; i++) {
      (function (i) {
        var p = anchors[i];
        var s = bySeat[i];
        var snap = cfg.snap;
        var cls = 'seat';
        var kids = [];
        var name = '';
        if (!s) {
          if (!cfg.showEmpty) return;
          cls += ' free';
          kids = [h('span', { class: 'nm', text: '+' })];
        } else {
          name = seatLabel(s, snap);
          /* recorded on positions alone: the plaque already IS the position, so
             it is not repeated on the line below */
          var anon = !s.name && snap && snap.positions[i];
          if (s.hero) cls += ' hero';
          if (snap) {
            if (snap.folded[i]) cls += ' folded';
            if (snap.next && snap.next.type === 'action' && snap.next.seat === i) cls += ' act';
          }
          if (targets[i]) cls += ' next';
          kids.push(h('span', { class: 'nm', text: name }));
          if (snap && snap.positions[i] && !anon) {
            kids.push(h('span', { class: 'p', text: snap.positions[i] }));
          }
          var stackNow = s.stack;
          if (snap && stackNow != null) stackNow = stackNow - (snap.contrib[i] || 0);
          kids.push(h('span', {
            class: 'st',
            text: (snap && (snap.allin || {})[i]) ? 'all-in'
              : (stackNow == null ? '—' : num(stackNow))
          }));
          var hole = cfg.hole && cfg.hole[i];
          if (hole && hole.length) kids.push(h('span', { class: 'cards' }, [cardsEl(hole, 'hole')]));
        }
        box.appendChild(h('button', {
          class: cls,
          style: 'left:' + p.x + '%;top:' + p.y + '%',
          'aria-label': (s ? name + ', seat ' + (i + 1) : 'Empty seat ' + (i + 1)) +
            (targets[i] ? '. Give the action to them' : ''),
          on: { click: function () { if (cfg.onSeat) cfg.onSeat(i); } }
        }, kids));

        /* per-seat committed chips this street */
        if (cfg.snap) {
          var last = cfg.snap.streets[cfg.snap.streets.length - 1];
          var amt = last && last.commit ? last.commit[i] : 0;
          if (amt > 0 && !cfg.snap.folded[i]) {
            var bp = betPos(anchors, i);
            box.appendChild(h('span', {
              class: 'bet', style: 'left:' + bp.x + '%;top:' + bp.y + '%', text: num(amt)
            }));
          }
        }
      })(i);
    }

    var dp = dealerPos(anchors, cfg.buttonSeat);
    var disc = h('button', {
      class: 'dealer', style: 'left:' + dp.left + ';top:' + dp.top + ';',
      'aria-label': 'Dealer button, seat ' + (cfg.buttonSeat + 1) +
        (cfg.editable ? '. Drag onto a seat to move it.' : '')
    }, [h('i', { text: 'D', 'aria-hidden': 'true' })]);
    if (cfg.editable && cfg.onButton) {
      makeDraggable(disc, box, bySeat, anchors, cfg.onButton);
    }
    box.appendChild(disc);
    return box;
  }

  function makeDraggable(disc, box, bySeat, anchors, onDrop) {
    var dragging = false, moved = false, startX = 0, startY = 0;
    disc.addEventListener('pointerdown', function (ev) {
      dragging = true; moved = false;
      startX = ev.clientX; startY = ev.clientY;
      disc.classList.add('drag');
      box.classList.add('picking');
      disc.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    disc.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      if (Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8) moved = true;
      var r = box.getBoundingClientRect();
      disc.style.left = (((ev.clientX - r.left) / r.width) * 100) + '%';
      disc.style.top = (((ev.clientY - r.top) / r.height) * 100) + '%';
    });
    disc.addEventListener('pointerup', function (ev) {
      if (!dragging) return;
      dragging = false;
      disc.classList.remove('drag');
      box.classList.remove('picking');
      /* a tap is not a drag — snapping it to the nearest seat would move the
         button somewhere the user never aimed at */
      if (!moved) { render(); toast('Drag the D onto a seat to move the button.'); return; }
      var r = box.getBoundingClientRect();
      var px = ((ev.clientX - r.left) / r.width) * 100;
      var py = ((ev.clientY - r.top) / r.height) * 100;
      var best = null, bd = 1e9;
      Object.keys(bySeat).forEach(function (k) {
        var p = anchors[Number(k)];
        if (!p) return;
        var d = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py);
        if (d < bd) { bd = d; best = Number(k); }
      });
      if (best != null) onDrop(best); else render();
    });
  }

  /* --------------------------------------------------------- seat sheet */

  function seatSheet(seatIdx) {
    var s = session();
    var existing = (s.seats || []).filter(function (x) { return x.seat === seatIdx; })[0];
    var body = h('div', {});

    if (existing) {
      var pname = rosterName(existing.playerId);
      var isMe = me() && existing.playerId === me().id;
      body.appendChild(h('div', { class: 'rowlist' }, [
        h('button', {
          class: 'lrow', on: {
            click: function () {
              var input = h('input', { class: 'input', value: pname, 'aria-label': 'Name' });
              openSheet('Rename', 'Changes the name everywhere, including saved hands.',
                h('div', { class: 'field' }, [input]), [
                h('button', {
                  class: 'btn btn-primary', text: 'Save',
                  on: {
                    click: function () {
                      var nm = input.value.trim();
                      if (!nm) { input.focus(); return; }
                      var pl = db.roster.filter(function (r) { return r.id === existing.playerId; })[0];
                      if (pl) pl.name = nm;
                      renameInHands(existing.playerId, nm);
                      save(); closeSheet(); render();
                    }
                  }
                })
              ]);
              setTimeout(function () { input.focus(); }, 60);
            }
          }
        }, [
          h('span', { class: 'g' }, [
            h('span', { class: 'a', text: 'Name' }),
            h('span', { class: 'b', text: pname })
          ]), icon('caret-right', 18)
        ]),
        h('button', {
          class: 'lrow', on: {
            click: function () {
              keypad({
                title: 'Stack — ' + pname, currency: s.currency,
                value: existing.stack || '',
                onDone: function (n) { existing.stack = n; save(); render(); }
              });
            }
          }
        }, [
          h('span', { class: 'g' }, [
            h('span', { class: 'a', text: 'Stack' }),
            h('span', { class: 'b', text: existing.stack == null ? 'Not set' : s.currency + num(existing.stack) })
          ]), icon('caret-right', 18)
        ]),
        h('button', {
          class: 'lrow', on: {
            click: function () { s.buttonSeat = seatIdx; save(); closeSheet(); render(); }
          }
        }, [h('span', { class: 'g' }, [h('span', { class: 'a', text: 'Give the dealer button' })]), icon('caret-right', 18)]),
        !isMe ? h('button', {
          class: 'lrow', on: {
            click: function () {
              db.roster.forEach(function (r) { r.me = false; });
              var p = db.roster.filter(function (r) { return r.id === existing.playerId; })[0];
              if (p) p.me = true;
              save(); closeSheet(); render();
            }
          }
        }, [h('span', { class: 'g' }, [h('span', { class: 'a', text: 'This is me' })]), icon('caret-right', 18)]) : null,
        h('button', {
          class: 'lrow', on: {
            click: function () {
              s.seats = s.seats.filter(function (x) { return x.seat !== seatIdx; });
              save(); closeSheet(); render();
            }
          }
        }, [h('span', { class: 'g' }, [h('span', { class: 'a', text: 'Empty this seat' })]), icon('trash', 18)])
      ].filter(Boolean)));
      openSheet(pname + ' · seat ' + (seatIdx + 1), null, body);
      return;
    }

    /* Empty seat: type the name, optionally the stack, done. No roster list —
       Ernest types every name, so a list of past names is just noise in the way.
       Identity is preserved instead by matching the typed name to an existing
       roster entry, so the same person keeps one id across sessions. */
    var nameInput = h('input', {
      class: 'input', placeholder: 'Name', 'aria-label': 'Player name',
      autocapitalize: 'words', autocomplete: 'off'
    });
    var stackInput = h('input', {
      class: 'input', type: 'number', inputmode: 'decimal', min: '0',
      placeholder: 'Optional', 'aria-label': 'Stack'
    });
    var meCheck = h('input', {
      type: 'checkbox',
      on: { change: function () { if (meCheck.checked && !nameInput.value) nameInput.value = 'EDB'; } }
    });
    body.appendChild(h('div', { class: 'field' }, [
      h('label', { text: 'Name' }), nameInput
    ]));
    body.appendChild(h('div', { class: 'field', style: 'margin-top:12px' }, [
      h('label', { text: 'Stack — leave blank if you are not tracking it' }), stackInput
    ]));
    body.appendChild(h('label', { class: 'check', style: 'margin-top:14px' }, [
      meCheck, h('span', { text: 'This is me' })
    ]));

    /* playerFor is shared with the loose-hand path — an existing player keeps the
       name already stored, so retyping it in the wrong case cannot rewrite hands
       already saved. Use the Rename row for a real rename. */

    openSheet('Seat ' + (seatIdx + 1), null, body, [
      h('button', {
        class: 'btn btn-primary', text: 'Seat player',
        on: {
          click: function () {
            var nm = nameInput.value.trim();
            if (!nm && meCheck.checked) nm = 'EDB';
            if (!nm) { nameInput.focus(); return; }
            var taken = (s.seats || []).filter(function (x) {
              return (rosterName(x.playerId) || '').trim().toLowerCase() === nm.toLowerCase();
            })[0];
            if (taken) {
              toast(rosterName(taken.playerId) + ' is already in seat ' +
                (taken.seat + 1) + '.', 'warn');
              return;
            }
            var p = playerFor(nm, meCheck.checked);
            var st = Number(stackInput.value);
            s.seats.push({
              seat: seatIdx, playerId: p.id, stack: st > 0 ? st : null
            });
            if (s.seats.length === 1) s.buttonSeat = seatIdx;
            save(); closeSheet(); render();
          }
        }
      })
    ]);
  }

  /* ============================================================ views */

  function render() {
    var root = document.getElementById('app');
    root.innerHTML = '';
    var v = { top: null, main: null, cmd: null };
    if (route.name === 'sessions') v = viewSessions();
    else if (route.name === 'newsession') v = viewNewSession();
    else if (route.name === 'session') v = viewSession();
    else if (route.name === 'editsession') v = viewEditSession();
    else if (route.name === 'hand') v = viewHand();
    else if (route.name === 'result') v = viewResult();
    else v = viewSessions();

    root.appendChild(topbar(v.top));
    root.appendChild(h('main', {}, [h('div', { class: 'wrap' }, [v.main])]));
    if (v.cmd) root.appendChild(cmdbar(v.cmd, v.hint));

      if (mode === 'system') { r.removeAttribute('data-theme'); try { localStorage.removeItem('eds-theme'); } catch (e) { } }

    var seg = h('div', { class: 'segmented', role: 'group', 'aria-label': 'Theme' });

    menu.appendChild(h('button', {

  /* ---------------------------------------------------------- sessions */

  function viewSessions() {
    var main = h('div', {});
    var sessions = realSessions();
    var loose = looseBox(false);

    /* A session is the deliberate act — set the table, then log hands into it.
       Adding a hand is the frequent one, so it owns the command bar and this
       sits quietly at the top. */
    main.appendChild(h('button', {
      class: 'btn btn-ghost topact', text: 'New session',
      on: { click: function () { go('newsession'); } }
    }));

    if (loose && loose.hands.length) {
      var ln = sessionNet(loose);
      var lTotal = loose.hands.length;

      main.appendChild(sectionHead('Not in a session', lTotal + ''));
      main.appendChild(h('div', { class: 'rowlist' }, [
        h('button', {

        }, [

            h('span', { class: 'a', text: 'Loose hands' }),
            h('span', {
              class: 'b',

            })
          ]),

          })
        ])
      ]));
    }

    if (!sessions.length) {
      main.appendChild(h('div', { class: 'empty' }, [
        h('h3', { text: 'No sessions yet' }),
        h('p', {

            'and who is at the table.'
        })
      ]));
    } else {
      main.appendChild(sectionHead('Sessions', sessions.length + ''));
      var list = h('div', { class: 'rowlist' });
      sessions.forEach(function (s) {
        var net = sessionNet(s);
        var done = s.hands.filter(function (x) { return x.complete; }).length;
        list.appendChild(h('button', {
          class: 'lrow', on: { click: function () { go('session', { sessionId: s.id }); } }
        }, [
